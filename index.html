// ================================================================
// 글로벌 상태
// ================================================================
var tabs = [];
var activeTabId = null;

// ================================================================
// 초기화: 페이지 로드 시 구글 시트에서 데이터 불러오기 시도
// ================================================================
window.addEventListener("DOMContentLoaded", function() {
    renderPresetList();
    setStatus("구글 스프레드시트에서 데이터 확인 중...", "saving");
    loadFromGoogle();
});

// ================================================================
// 상태바 업데이트
// ================================================================
function setStatus(msg, type) {
    var bar = document.getElementById("statusBar");
    bar.textContent = msg;
    bar.className = "status-bar";
    if (type === "online") bar.classList.add("status-online");
    else if (type === "saving") bar.classList.add("status-saving");
    else if (type === "error") bar.classList.add("status-error");
}

// ================================================================
// 구글 스프레드시트에 저장
// ================================================================
function saveToGoogle() {
    if (activeTabId) saveTabData(activeTabId);
    if (tabs.length === 0) {
        alert("저장할 데이터가 없습니다.");
        return;
    }

    setStatus("구글 스프레드시트에 저장 중...", "saving");

    var saveData = [];
    for (var i = 0; i < tabs.length; i++) {
        saveData.push({
            bank: tabs[i].bank,
            branch: tabs[i].branch,
            addr: tabs[i].addr,
            tel: tabs[i].tel,
            data: tabs[i].data
        });
    }

    fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ banks: saveData })
    })
    .then(function() {
        setStatus("구글 스프레드시트 저장 완료! (" + new Date().toLocaleTimeString() + ")", "online");
        alert("구글 스프레드시트에 저장 완료!\n" + tabs.length + "개 은행 데이터가 저장되었습니다.");
    })
    .catch(function(err) {
        setStatus("저장 실패: " + err.message, "error");
        alert("저장 실패: " + err.message);
    });
}

// ================================================================
// 구글 스프레드시트에서 불러오기
// JSONP 방식으로 CORS 우회
// ================================================================
function loadFromGoogle() {
    setStatus("구글 스프레드시트에서 불러오는 중...", "saving");

    // JSONP 콜백 함수명 생성
    var callbackName = "googleCallback_" + Date.now();

    // 콜백 함수 등록
    window[callbackName] = function(response) {
        // 스크립트 태그 제거
        var scriptTag = document.getElementById("jsonp_" + callbackName);
        if (scriptTag) scriptTag.remove();
        delete window[callbackName];

        if (response && response.success && response.data && response.data.length > 0) {
            tabs = [];
            activeTabId = null;
            var banks = response.data;

            for (var i = 0; i < banks.length; i++) {
                var id = "tab_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5);
                tabs.push({
                    id: id,
                    bank: banks[i].bank,
                    branch: banks[i].branch,
                    addr: banks[i].addr || "",
                    tel: banks[i].tel || "",
                    data: banks[i].data || {}
                });
            }

            if (tabs.length > 0) {
                activeTabId = tabs[0].id;
                renderTabs();
                renderTabContent(activeTabId);
                setStatus("구글 스프레드시트에서 " + tabs.length + "개 은행 데이터 로딩 완료", "online");
            }
        } else {
            setStatus("저장된 데이터 없음 — 은행을 추가하세요", "online");
        }
    };

    // JSONP 요청: script 태그로 GET 요청
    var script = document.createElement("script");
    script.id = "jsonp_" + callbackName;
    script.src = GOOGLE_SCRIPT_URL + "?callback=" + callbackName;

    // 에러 처리
    script.onerror = function() {
        delete window[callbackName];
        script.remove();
        setStatus("불러오기 실패 — 네트워크 확인", "error");
    };

    document.body.appendChild(script);
}

// ================================================================
// 프리셋 리스트 렌더링
// ================================================================
function renderPresetList() {
    var container = document.getElementById("presetList");
    container.innerHTML = "";
    for (var i = 0; i < PRESET_BANKS.length; i++) {
        var p = PRESET_BANKS[i];
        var alreadyAdded = false;
        for (var j = 0; j < tabs.length; j++) {
            if (tabs[j].bank === p.bank && tabs[j].branch === p.branch) {
                alreadyAdded = true;
                break;
            }
        }
        var div = document.createElement("div");
        div.className = "preset-item";
        if (alreadyAdded) div.style.opacity = "0.4";
        div.setAttribute("data-idx", i);
        div.setAttribute("data-added", alreadyAdded ? "1" : "0");
        div.innerHTML =
            '<input type="checkbox" class="preset-chk" data-idx="' + i + '"' + (alreadyAdded ? " disabled" : "") + '>' +
            '<span class="preset-bank">' + p.bank + '</span>' +
            '<span class="preset-branch">' + p.branch + '</span>' +
            '<span class="preset-addr">' + p.addr + '</span>' +
            '<span class="preset-tel">' + p.tel + '</span>';
        (function(divEl, added) {
            divEl.addEventListener("click", function(e) {
                if (added) return;
                if (e.target.type === "checkbox") return;
                var chk = divEl.querySelector(".preset-chk");
                chk.checked = !chk.checked;
            });
        })(div, alreadyAdded);
        container.appendChild(div);
    }
}

// ================================================================
// 직접 입력 추가
// ================================================================
function addCustom() {
    var bank = document.getElementById("customBank").value.trim();
    var branch = document.getElementById("customBranch").value.trim();
    var addr = document.getElementById("customAddr").value.trim();

    document.getElementById("customBranch").value = "";

// ================================================================
// 탭 추가
// ================================================================
function addTab(bank, branch, addr, tel) {
    for (var i = 0; i < tabs.length; i++) {
        if (tabs[i].bank === bank && tabs[i].branch === branch) {
            alert(bank + " " + branch + "은(는) 이미 추가되어 있습니다.");
            return;
        }
    }
    var id = "tab_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5);
    tabs.push({ id: id, bank: bank, branch: branch, addr: addr, tel: tel, data: {} });
    renderTabs();
    switchTab(id);
}

// ================================================================
// 탭 렌더링
// ================================================================
function renderTabs() {
    var nav = document.getElementById("tabNav");
    nav.innerHTML = "";
    for (var i = 0; i < tabs.length; i++) {
        var t = tabs[i];
        var btn = document.createElement("div");
        btn.className = "tab-btn" + (t.id === activeTabId ? " active" : "");
        var shortBank = t.bank.replace("은행", "").replace("NH농협", "농협").replace("KB국민", "KB").replace("IBK기업", "IBK").replace("Sh수협", "수협").replace("SC제일", "SC");
        btn.setAttribute("data-id", t.id);
        btn.innerHTML =
            '<span onclick="switchTab(\'' + t.id + '\')">' + shortBank + " " + t.branch + '</span>' +
            '<span class="close-tab" onclick="event.stopPropagation(); removeTab(\'' + t.id + '\')">×</span>';
        nav.appendChild(btn);
    }
}

// ================================================================
// 탭 전환
// ================================================================
function switchTab(id) {
    if (activeTabId) saveTabData(activeTabId);
    activeTabId = id;
    renderTabs();
    renderTabContent(id);
}

// ================================================================
// 탭 삭제
// ================================================================
function removeTab(id) {
    var tab = null;
    var tabIdx = -1;
    for (var i = 0; i < tabs.length; i++) {
        if (tabs[i].id === id) { tab = tabs[i]; tabIdx = i; break; }
    }
    if (!confirm(tab.bank + " " + tab.branch + " 탭을 삭제할까요?")) return;
    tabs.splice(tabIdx, 1);
    if (activeTabId === id) {
        activeTabId = tabs.length > 0 ? tabs[0].id : null;
    }
    renderTabs();
    if (activeTabId) renderTabContent(activeTabId);
    else document.getElementById("tabContents").innerHTML = "";
}

// ================================================================
// 탭 콘텐츠 렌더링
// ================================================================
function renderTabContent(id) {
    var tab = null;
    for (var i = 0; i < tabs.length; i++) {
        if (tabs[i].id === id) { tab = tabs[i]; break; }
    }
    if (!tab) return;

    var container = document.getElementById("tabContents");
    container.innerHTML = "";

    var content = document.createElement("div");
    content.className = "tab-content active";

    // 은행 정보 헤더
    var infoSection = document.createElement("div");
    infoSection.className = "section";
    infoSection.style.background = "#e3f2fd";
    infoSection.innerHTML =
        '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">' +
        '<div><strong style="font-size:18px; color:#1a237e;">' + tab.bank + " " + tab.branch + '</strong>' +
        '<div style="font-size:12px; color:#555; margin-top:4px;">' + tab.addr + '</div></div>' +
        '<div style="text-align:right;"><div style="font-size:15px; font-weight:700; color:#2e7d32;">' + tab.tel + '</div></div></div>';
    content.appendChild(infoSection);

    // 각 섹션별 필드
    for (var s = 0; s < FIELD_SECTIONS.length; s++) {
        var section = FIELD_SECTIONS[s];
        var sec = document.createElement("div");
        sec.className = "section";
        var title = document.createElement("div");
        title.className = "section-title";
        title.textContent = section.title;
        sec.appendChild(title);

        for (var f = 0; f < section.fields.length; f++) {
            var field = section.fields[f];
            var row = document.createElement("div");
            row.className = "field-row";

            var label = document.createElement("div");
            label.className = "field-label";
            label.innerHTML = (field.num ? '<span class="field-num">' + field.num + "</span>" : "") + field.label;
            row.appendChild(label);

            var inputDiv = document.createElement("div");
            inputDiv.className = "field-input";
            var fieldId = id + "_" + field.id;
            var savedVal = tab.data[field.id] || field.defaultVal || "";

            if (field.type === "text") {
                inputDiv.innerHTML = '<input type="text" id="' + fieldId + '" value="' + savedVal + '"' + (field.readonly ? ' readonly style="background:#e8eaf6;"' : "") + ">";
            } else if (field.type === "number") {
                inputDiv.innerHTML = '<input type="number" step="0.01" id="' + fieldId + '" value="' + savedVal + '"' + (field.readonly ? ' readonly style="background:#e8eaf6;"' : "") + ">";
            } else if (field.type === "select") {
                var opts = "";
                for (var o = 0; o < field.options.length; o++) {
                    opts += '<option value="' + field.options[o] + '"' + (savedVal === field.options[o] ? " selected" : "") + ">" + field.options[o] + "</option>";
                }
                inputDiv.innerHTML = '<select id="' + fieldId + '">' + opts + "</select>";
            } else if (field.type === "radio") {
                var radios = "";
                for (var r = 0; r < field.options.length; r++) {
                    var checked = savedVal === field.options[r] ? " checked" : "";
                    radios += '<label><input type="radio" name="' + fieldId + '" value="' + field.options[r] + '"' + checked + "> " + field.options[r] + "</label>";
                }
                inputDiv.innerHTML = '<div class="radio-group">' + radios + "</div>";
            } else if (field.type === "textarea") {
                inputDiv.innerHTML = '<textarea id="' + fieldId + '">' + savedVal + "</textarea>";
            }
            row.appendChild(inputDiv);

            if (field.hint) {
                var hint = document.createElement("div");
                hint.className = "field-hint";
                hint.textContent = field.hint;
                row.appendChild(hint);
            }
            sec.appendChild(row);
        }
        content.appendChild(sec);
    }

    // 자동 계산 박스
    var calcBox = document.createElement("div");
    calcBox.className = "calc-box";
    calcBox.innerHTML =
        '<div class="calc-title">자동 계산 (2억원 · 1년 거치 · 9년 원리금균등)</div>' +
        '<div class="calc-row"><span class="calc-label">최종금리</span><span class="calc-value" id="calc_rate_' + id + '">-</span></div>' +
        '<div class="calc-row"><span class="calc-label">거치 중 월 이자</span><span class="calc-value" id="calc_grace_' + id + '">-</span></div>' +
        '<div class="calc-row"><span class="calc-label">거치 후 월 상환액</span><span class="calc-value" id="calc_monthly_' + id + '">-</span></div>' +
        '<div class="calc-row"><span class="calc-label">10년 총 이자</span><span class="calc-value" id="calc_total_' + id + '">-</span></div>' +
        '<div class="calc-row"><span class="calc-label">연 10% 추가상환 시 총 이자 (추정)</span><span class="calc-value" id="calc_extra_' + id + '">-</span></div>';
    content.appendChild(calcBox);

    container.appendChild(content);

// ================================================================
// 금리 자동계산 이벤트
// ================================================================
function bindCalcEvents(tabId) {
    var fields = ["base_rate", "add_rate", "discount_total"];
    for (var i = 0; i < fields.length; i++) {
        var el = document.getElementById(tabId + "_" + fields[i]);
        if (el) {
            el.addEventListener("input", (function(tid) {
                return function() { doCalc(tid); };
            })(tabId));
        }
    }
}

// ================================================================
// 자동 계산 로직
// ================================================================
function doCalc(tabId) {
    var getVal = function(fid) {
        var el = document.getElementById(tabId + "_" + fid);
        return el ? parseFloat(el.value) || 0 : 0;
    };

    var base = getVal("base_rate");
    var add = getVal("add_rate");
    var discount = getVal("discount_total");
    var finalRate = base + add - discount;

    var finalEl = document.getElementById(tabId + "_final_rate");
    if (finalEl && (base > 0 || add > 0)) finalEl.value = finalRate.toFixed(2);

    if (finalRate <= 0) {
        var keys = ["calc_rate", "calc_grace", "calc_monthly", "calc_total", "calc_extra"];
        for (var i = 0; i < keys.length; i++) {
            var el = document.getElementById(keys[i] + "_" + tabId);
            if (el) el.textContent = "-";
        }
        return;
    }

    var principal = 200000000;
    var monthlyRate = finalRate / 100 / 12;
    var graceMonths = 12;
    var repayMonths = 108;
    var gracePayment = principal * monthlyRate;
    var factor = Math.pow(1 + monthlyRate, repayMonths);
    var monthlyPayment = principal * monthlyRate * factor / (factor - 1);
    var totalPaid = (gracePayment * graceMonths) + (monthlyPayment * repayMonths);
    var totalInterest = totalPaid - principal;

    // 연 10% 추가상환 시뮬레이션
    var balance = principal;
    var totalInterestExtra = 0;
    for (var m = 1; m <= graceMonths; m++) {
        totalInterestExtra += balance * monthlyRate;
        if (m === 12) { balance -= principal * 0.1; if (balance < 0) balance = 0; }
    }
    for (var year = 2; year <= 10; year++) {
        if (balance <= 0) break;
        for (var m2 = 1; m2 <= 12; m2++) {
            if (balance <= 0) break;
            var interest = balance * monthlyRate;
            totalInterestExtra += interest;
            var remainTotal = (10 - year) * 12 + (12 - m2) + 1;
            if (remainTotal > 0) {
                var f2 = Math.pow(1 + monthlyRate, remainTotal);
                var pmt = balance * monthlyRate * f2 / (f2 - 1);
                balance -= (pmt - interest);
            }
        }
        var extraRepay = Math.min(principal * 0.1, balance);
        balance -= extraRepay;
        if (balance < 0) balance = 0;
    }

    var fmt = function(n) { return Math.round(n).toLocaleString("ko-KR"); };

    document.getElementById("calc_rate_" + tabId).textContent = finalRate.toFixed(2) + "%";
    document.getElementById("calc_grace_" + tabId).textContent = fmt(gracePayment) + "원";
    document.getElementById("calc_monthly_" + tabId).textContent = fmt(monthlyPayment) + "원";
    document.getElementById("calc_total_" + tabId).textContent = fmt(totalInterest) + "원";
    document.getElementById("calc_extra_" + tabId).textContent = fmt(totalInterestExtra) + "원 (추정)";

    var graceEl = document.getElementById(tabId + "_monthly_grace");
    var afterEl = document.getElementById(tabId + "_monthly_after");
    var totalEl = document.getElementById(tabId + "_total_interest");
    if (graceEl) graceEl.value = fmt(gracePayment);
    if (afterEl) afterEl.value = fmt(monthlyPayment);
    if (totalEl) totalEl.value = fmt(totalInterest);
}

// ================================================================
// 현재 탭 데이터 저장 (메모리)
// ================================================================
function saveTabData(tabId) {
    var tab = null;
    for (var i = 0; i < tabs.length; i++) {
        if (tabs[i].id === tabId) { tab = tabs[i]; break; }
    }
    if (!tab) return;

    for (var s = 0; s < FIELD_SECTIONS.length; s++) {
        for (var f = 0; f < FIELD_SECTIONS[s].fields.length; f++) {
            var field = FIELD_SECTIONS[s].fields[f];
            var fieldId = tabId + "_" + field.id;
            if (field.type === "radio") {
                var checked = document.querySelector('input[name="' + fieldId + '"]:checked');
                tab.data[field.id] = checked ? checked.value : "";
            } else {
                var el = document.getElementById(fieldId);
                tab.data[field.id] = el ? el.value : "";
            }
        }
    }
}

// ================================================================
// 전체 삭제
// ================================================================
function clearAll() {
    if (!confirm("모든 탭과 데이터를 삭제할까요?")) return;
    tabs = [];
    activeTabId = null;
    document.getElementById("tabNav").innerHTML = "";
    document.getElementById("tabContents").innerHTML = "";
    setStatus("전체 삭제 완료", "online");
}

// ================================================================
// 비교표
// ================================================================
function showCompare() {
    if (activeTabId) saveTabData(activeTabId);
    if (tabs.length === 0) { alert("비교할 은행이 없습니다."); return; }

    var compareFields = [
        { id: "product_name", label: "상품명" },
        { id: "final_rate", label: "최종금리 (%)", highlight: true },
        { id: "base_rate_type", label: "기준금리 종류" },
        { id: "base_rate", label: "기준금리 (%)" },
        { id: "add_rate", label: "가산금리 (%)" },
        { id: "discount_total", label: "우대합계 (%)" },
        { id: "amort_10yr", label: "10년 상환 가능?", highlight: true },
        { id: "grace_1yr", label: "1년 거치 가능?" },
        { id: "repay_method", label: "상환방식" },
        { id: "free_repay", label: "연10% 무료상환", highlight: true },
        { id: "free_repay_nonres", label: "비주거 적용?", highlight: true },
        { id: "prepay_fee", label: "중도상환수수료 (%)" },
        { id: "fee_waiver", label: "수수료면제 시점" },
        { id: "ltv", label: "LTV (%)", highlight: true },
        { id: "limit_ok", label: "2억 한도 OK?" },
        { id: "co_owner", label: "공동명의 처리" },
        { id: "no_guarantor", label: "연대보증 불요?" },
        { id: "appraisal_cost", label: "감정평가비" },
        { id: "mortgage_fee", label: "근저당설정비" },
        { id: "process_days", label: "소요기간" },
        { id: "monthly_grace", label: "거치중 월상환" },
        { id: "monthly_after", label: "거치후 월상환" },
        { id: "total_interest", label: "10년 총이자" },
        { id: "eval_grade", label: "종합평가", highlight: true }
    ];

    var html = '<table class="compare-table"><tr><th>항목</th>';
    for (var i = 0; i < tabs.length; i++) {
        var short = tabs[i].bank.replace("은행", "").replace("NH농협", "농협").replace("KB국민", "KB");
        html += "<th>" + short + "<br>" + tabs[i].branch + "</th>";
    }
    html += "</tr>";
    html += "<tr><td style='font-weight:600;'>전화번호</td>";
    for (var i = 0; i < tabs.length; i++) html += "<td>" + tabs[i].tel + "</td>";
    html += "</tr>";

    for (var f = 0; f < compareFields.length; f++) {
        var cf = compareFields[f];
        html += "<tr><td style='font-weight:600; text-align:left; padding-left:8px;'>" + cf.label + "</td>";
        for (var i = 0; i < tabs.length; i++) {
            var val = tabs[i].data[cf.id] || "-";
            var cls = cf.highlight && val !== "-" && val !== "선택" ? ' class="highlight-cell"' : "";
            html += "<td" + cls + ">" + val + "</td>";
        }
        html += "</tr>";
    }
    html += "</table>";

    document.getElementById("compareBody").innerHTML = html;
    document.getElementById("compareOverlay").classList.add("show");
}

function closeCompare() {
    document.getElementById("compareOverlay").classList.remove("show");
}

// ================================================================
// 엑셀 다운로드
// ================================================================
function downloadExcel() {
    if (activeTabId) saveTabData(activeTabId);
    if (tabs.length === 0) { alert("다운로드할 데이터가 없습니다."); return; }

    var wb = XLSX.utils.book_new();

    var compareFields = [
        "product_name", "final_rate", "base_rate_type", "base_rate", "add_rate",
        "discount_total", "amort_10yr", "grace_1yr", "repay_method",
        "free_repay", "free_repay_nonres", "prepay_fee", "fee_waiver",
        "ltv", "limit_ok", "co_owner", "no_guarantor",
        "appraisal_cost", "mortgage_fee", "process_days",
        "monthly_grace", "monthly_after", "total_interest",
        "eval_grade", "eval_reason"
    ];
    var compareLabels = {
        product_name: "상품명", final_rate: "최종금리(%)", base_rate_type: "기준금리종류",
        base_rate: "기준금리(%)", add_rate: "가산금리(%)", discount_total: "우대합계(%)",
        amort_10yr: "10년상환가능", grace_1yr: "1년거치가능", repay_method: "상환방식",
        free_repay: "연10%무료상환", free_repay_nonres: "비주거적용", prepay_fee: "중도상환수수료(%)",
        fee_waiver: "수수료면제시점", ltv: "LTV(%)", limit_ok: "2억한도OK",
        co_owner: "공동명의처리", no_guarantor: "연대보증불요", appraisal_cost: "감정평가비",
        mortgage_fee: "근저당설정비", process_days: "소요기간",
        monthly_grace: "거치중월상환", monthly_after: "거치후월상환", total_interest: "10년총이자",
        eval_grade: "종합평가", eval_reason: "평가사유"
    };

    var cmpHeader = ["항목"];
    for (var i = 0; i < tabs.length; i++) cmpHeader.push(tabs[i].bank + " " + tabs[i].branch);
    var cmpData = [cmpHeader];

    var addrRow = ["주소"];
    for (var i = 0; i < tabs.length; i++) addrRow.push(tabs[i].addr);
    cmpData.push(addrRow);

    var telRow = ["전화번호"];
    for (var i = 0; i < tabs.length; i++) telRow.push(tabs[i].tel);
    cmpData.push(telRow);

    for (var f = 0; f < compareFields.length; f++) {
        var row = [compareLabels[compareFields[f]] || compareFields[f]];
        for (var i = 0; i < tabs.length; i++) row.push(tabs[i].data[compareFields[f]] || "");
        cmpData.push(row);
    }

    var ws1 = XLSX.utils.aoa_to_sheet(cmpData);
    ws1["!cols"] = [{ wch: 18 }];
    for (var i = 0; i < tabs.length; i++) ws1["!cols"].push({ wch: 22 });
    XLSX.utils.book_append_sheet(wb, ws1, "비교표");

    var detailHeader = ["은행", "지점", "주소", "전화번호"];
    for (var s = 0; s < FIELD_SECTIONS.length; s++) {
        for (var f = 0; f < FIELD_SECTIONS[s].fields.length; f++) {
            var field = FIELD_SECTIONS[s].fields[f];
            detailHeader.push((field.num ? field.num + " " : "") + field.label);
        }
    }
    var detailData = [detailHeader];
    for (var i = 0; i < tabs.length; i++) {
        var row = [tabs[i].bank, tabs[i].branch, tabs[i].addr, tabs[i].tel];
        for (var s = 0; s < FIELD_SECTIONS.length; s++) {
            for (var f = 0; f < FIELD_SECTIONS[s].fields.length; f++) {
                row.push(tabs[i].data[FIELD_SECTIONS[s].fields[f].id] || "");
            }
        }
        detailData.push(row);
    }
    var ws2 = XLSX.utils.aoa_to_sheet(detailData);
    ws2["!cols"] = [];
    for (var i = 0; i < detailHeader.length; i++) ws2["!cols"].push({ wch: 18 });
    XLSX.utils.book_append_sheet(wb, ws2, "상세데이터");

    var today = new Date().toISOString().slice(0, 10).replace(/-/g, "");
    XLSX.writeFile(wb, "비주거담보대출_상담기록_" + today + ".xlsx");
}
</script>
