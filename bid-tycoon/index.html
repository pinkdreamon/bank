<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>입찰 타이쿤 — 나라장터 입찰 한 바퀴</title>
<style>
  :root{
    --navy:#0b2b49; --blue:#1163ad; --blue2:#0d5091; --sky:#eaf3fb; --sky2:#f4f9ff;
    --line:#dae3ee; --ink:#17202b; --muted:#64748b; --muted2:#8794a5;
    --green:#0d7a4e; --green-bg:#e8f6ef;
    --red:#bd3125; --red-bg:#fdecea;
    --amber:#9a6100; --amber-bg:#fdf3e0;
    --radius:14px; --shadow:0 1px 2px rgba(16,32,48,.06), 0 8px 24px -18px rgba(16,32,48,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:linear-gradient(180deg,#eef4fa 0%, #f7fafd 240px, #fbfcfe 100%);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    font-size:16px; line-height:1.62; -webkit-text-size-adjust:100%;
    letter-spacing:-.01em;
  }
  #app{max-width:1000px;margin:0 auto;padding:0 16px 64px}
  h1,h2,h3,h4{margin:0;line-height:1.35;letter-spacing:-.02em}
  p{margin:0 0 10px}
  p:last-child{margin-bottom:0}
  a{color:var(--blue);text-decoration:none;border-bottom:1px solid #c7dcf0}
  a:hover{border-bottom-color:var(--blue)}
  small{font-size:13px}
  .muted{color:var(--muted)}
  .tiny{font-size:12.5px;line-height:1.5}
  .nowrap{white-space:nowrap}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- 상단 바 ---------- */
  .topbar{position:sticky;top:0;z-index:40;margin:0 -16px 0;padding:9px 16px;
    background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .topbar-in{max-width:968px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14.5px;color:var(--navy)}
  .brand .dot{width:9px;height:9px;border-radius:3px;background:var(--blue)}
  .topbar .spacer{flex:1}
  .tstat{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .tstat b{color:var(--ink);font-weight:600}

  /* ---------- 공통 조각 ---------- */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
  .card+.card{margin-top:14px}
  .card.tight{padding:15px}
  .card.flat{box-shadow:none}
  .card-title{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:700;margin-bottom:12px}
  .card-title .ico{width:22px;height:22px;border-radius:7px;background:var(--sky);color:var(--blue);
    display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
  .sec-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
  .sec-head h2{font-size:18px}
  .sec-head .hint{font-size:13px;color:var(--muted)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border:1px solid var(--blue);background:var(--blue);color:#fff;font:inherit;font-weight:600;
    padding:12px 20px;border-radius:11px;cursor:pointer;transition:.15s;min-height:46px;
    font-size:15.5px;letter-spacing:-.01em}
  .btn:hover{background:var(--blue2);border-color:var(--blue2)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:#fff;color:var(--blue);border-color:#bcd6ec}
  .btn.ghost:hover{background:var(--sky2);border-color:var(--blue)}
  .btn.subtle{background:#fff;color:var(--muted);border-color:var(--line)}
  .btn.subtle:hover{background:#f7f9fc;color:var(--ink)}
  .btn.danger{background:#fff;color:var(--red);border-color:#e8bdb7}
  .btn.danger:hover{background:var(--red-bg)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .btn.wide{width:100%}
  .btn.sm{padding:8px 14px;min-height:38px;font-size:14px;border-radius:9px}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .btn-row .btn{flex:1 1 auto;min-width:0}

  .tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
    font-size:12px;font-weight:600;background:#eef2f7;color:#4b5c70;white-space:nowrap;border:1px solid transparent}
  .tag.blue{background:var(--sky);color:var(--blue2)}
  .tag.green{background:var(--green-bg);color:var(--green)}
  .tag.red{background:var(--red-bg);color:var(--red)}
  .tag.amber{background:var(--amber-bg);color:var(--amber)}
  .tag.line{background:#fff;border-color:var(--line);color:var(--muted)}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14.5px;align-items:baseline}
  .kv dt{color:var(--muted);white-space:nowrap}
  .kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
  @media(max-width:520px){ .kv{grid-template-columns:1fr;gap:2px} .kv dd{margin-bottom:8px;font-weight:600} }

  /* ---------- 안내·질문 박스 ---------- */
  .guide{background:var(--sky2);border:1px solid #cfe4f6;border-left:4px solid var(--blue);
    border-radius:12px;padding:14px 16px;margin-top:14px}
  .guide h4{font-size:14px;color:var(--blue2);display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .guide h4 .q{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px}
  .guide ul{margin:0;padding-left:18px}
  .guide li{margin-bottom:5px;font-size:14px}
  .guide li:last-child{margin-bottom:0}
  .guide p{font-size:14px}
  .quotes{margin-top:10px;border-top:1px dashed #cfe4f6;padding-top:10px}
  .quotes .qhead{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:0}
  .quote{font-size:13.5px;color:#3c4b5c;padding:6px 0 6px 12px;border-left:2px solid #c3d9ee;margin-bottom:6px}
  .quote a{font-size:12px;white-space:nowrap}

  .note{background:#f8fafc;border:1px dashed var(--line);border-radius:11px;padding:11px 13px;font-size:13px;color:var(--muted)}
  .warn{background:var(--amber-bg);border:1px solid #f0dcb4;border-radius:11px;padding:12px 14px;font-size:13.5px;color:#7a4d00}
  .bad{background:var(--red-bg);border:1px solid #f2c9c3;border-radius:11px;padding:12px 14px;font-size:13.5px;color:#8f2318}
  .good{background:var(--green-bg);border:1px solid #bfe3d0;border-radius:11px;padding:12px 14px;font-size:13.5px;color:#0a5c3b}
  .bad b,.good b,.warn b{font-weight:700}

  /* ---------- 시작 화면 ---------- */
  .hero{padding:26px 0 6px;text-align:center}
  .hero .kicker{display:inline-block;font-size:12.5px;font-weight:700;color:var(--blue);
    background:#fff;border:1px solid #cfe4f6;border-radius:999px;padding:5px 13px;margin-bottom:14px}
  .hero h1{font-size:31px;letter-spacing:-.035em;color:var(--navy)}
  .hero h1 .hl{color:var(--blue)}
  .hero .sub{font-size:15.5px;color:#46586d;max-width:560px;margin:12px auto 0}
  @media(max-width:560px){ .hero h1{font-size:25px} .hero .sub{font-size:14.5px} }

  .flow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:22px 0 4px}
  .flow span{font-size:12.5px;color:#4b5c70;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 9px}
  .flow span.on{background:var(--navy);color:#fff;border-color:var(--navy)}

  /* ---------- 업종 카드 ---------- */
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:760px){ .grid3{grid-template-columns:1fr} }
  .pick{background:#fff;border:2px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;
    transition:.15s;position:relative;text-align:left;font:inherit;color:inherit;display:block;width:100%}
  .pick:hover{border-color:#a9c9e6;transform:translateY(-1px)}
  .pick.on{border-color:var(--blue);background:var(--sky2);box-shadow:0 0 0 3px rgba(17,99,173,.09)}
  .pick .head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
  .pick .nm{font-size:17px;font-weight:700;color:var(--navy)}
  .dots{display:inline-flex;gap:3px}
  .dots i{width:8px;height:8px;border-radius:50%;background:#dde5ee;display:block}
  .dots i.f{background:var(--blue)}
  .pick .who{font-size:13px;color:var(--muted);margin-bottom:10px;min-height:34px}
  .mini{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:12.5px;color:#4b5c70}
  .mini dt{color:var(--muted2)}
  .mini dd{margin:0;font-weight:600;color:#33465b}
  .pick .first{margin-top:10px;font-size:12.5px;color:var(--blue2);background:#fff;border:1px dashed #c3d9ee;border-radius:9px;padding:7px 9px}

  /* ---------- 설문 ---------- */
  .quiz{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fbfdff}
  .quiz .qtext{font-weight:600;font-size:14.5px;margin-bottom:9px}
  .quiz .opts{display:flex;gap:8px;flex-wrap:wrap}
  .opt{font:inherit;font-size:13.5px;padding:9px 13px;border-radius:10px;border:1px solid var(--line);
    background:#fff;cursor:pointer;color:#3c4b5c;transition:.12s}
  .opt:hover{border-color:#a9c9e6}
  .opt.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}

  /* ---------- 진행 단계 ---------- */
  .steps{display:flex;gap:4px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
  .steps::-webkit-scrollbar{display:none}
  .steps .s{flex:none;font-size:11.5px;color:#9aa8b8;padding:4px 8px;border-radius:7px;background:#fff;border:1px solid var(--line);white-space:nowrap}
  .steps .s.done{color:var(--green);border-color:#c9e4d6;background:#f2faf6}
  .steps .s.now{color:#fff;background:var(--blue);border-color:var(--blue);font-weight:700}

  /* ---------- 공고 목록 ---------- */
  .notice{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 15px;
    transition:.13s;display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;box-shadow:var(--shadow)}
  .notice:hover{border-color:#a9c9e6;transform:translateY(-1px)}
  .notice+.notice{margin-top:10px}
  .notice .row1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .notice .nm{font-weight:700;font-size:15px;color:var(--navy);line-height:1.4}
  .notice .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:7px}
  .notice .meta b{color:#33465b;font-weight:600}
  .notice.locked{opacity:.72}
  .dday{font-size:12.5px;font-weight:700;color:var(--amber);background:var(--amber-bg);border-radius:8px;padding:3px 8px;white-space:nowrap}
  .dday.soon{color:var(--red);background:var(--red-bg)}

  /* ---------- 표 ---------- */
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:11px}
  table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:440px;background:#fff}
  th,td{padding:9px 11px;text-align:left;border-bottom:1px solid #eef2f7;white-space:nowrap}
  th{background:#f7fafd;color:var(--muted);font-weight:600;font-size:12.5px}
  tr:last-child td{border-bottom:none}
  tr.mine td{background:#eef7ff;font-weight:700;color:var(--blue2)}
  td.r{text-align:right;font-variant-numeric:tabular-nums}
  .rankbadge{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:#eef2f7;font-size:11.5px;font-weight:700;color:#4b5c70}
  .rankbadge.one{background:var(--blue);color:#fff}

  /* ---------- 투찰 ---------- */
  .money-in{display:flex;align-items:center;gap:8px;border:1px solid #c9d8e7;border-radius:11px;padding:4px 12px;background:#fff}
  .money-in:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(17,99,173,.1)}
  .money-in input{border:0;outline:0;font:inherit;font-size:19px;font-weight:700;padding:9px 0;flex:1;min-width:0;
    text-align:right;letter-spacing:-.02em;color:var(--navy);background:transparent}
  .money-in .unit{color:var(--muted);font-size:14px;font-weight:600}
  .gauge{height:8px;border-radius:99px;background:#eef2f7;overflow:hidden;margin-top:10px;position:relative}
  .gauge i{display:block;height:100%;background:var(--green)}
  .gauge i.mid{background:var(--amber)}
  .gauge i.low{background:var(--red)}
  .scaleline{position:relative;height:34px;margin-top:4px;font-size:11.5px;color:var(--muted2)}
  .scaleline span{position:absolute;transform:translateX(-50%);white-space:nowrap}
  .scaleline span:after{content:"";display:block;width:1px;height:6px;background:#cbd6e2;margin:2px auto 0}

  .picks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .pn{font:inherit;font-size:14px;font-weight:600;padding:9px 0;border-radius:9px;border:1px solid var(--line);
    background:#fff;cursor:pointer;color:#3c4b5c;transition:.12s;min-height:42px}
  .pn:hover{border-color:#a9c9e6;background:#fbfdff}
  .pn.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .pn:disabled{opacity:.42;cursor:not-allowed}
  @media(max-width:420px){ .picks{grid-template-columns:repeat(5,1fr);gap:5px} .pn{font-size:13px} }

  .pricechips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .chip{font:inherit;font-size:12.5px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:#4b5c70}
  .chip:hover{border-color:var(--blue);color:var(--blue)}

  .big{font-size:26px;font-weight:800;letter-spacing:-.03em;color:var(--navy);line-height:1.2}
  .big small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
  @media(max-width:420px){ .big{font-size:22px} }

  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
  .stat{background:#fbfdff;border:1px solid var(--line);border-radius:11px;padding:11px 12px}
  .stat .k{font-size:12px;color:var(--muted);margin-bottom:2px}
  .stat .v{font-size:17px;font-weight:700;color:var(--navy);letter-spacing:-.02em}
  .stat .v small{font-size:12px;font-weight:600;color:var(--muted)}

  .checklist{list-style:none;margin:0;padding:0}
  .checklist li{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;
    display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:14px;background:#fff}
  .checklist li.on{border-color:#9fcbb4;background:#f4fbf7}
  .checklist .box{width:19px;height:19px;border-radius:5px;border:1.5px solid #c3cedb;flex:none;display:grid;place-items:center;
    font-size:12px;color:#fff;margin-top:1px}
  .checklist li.on .box{background:var(--green);border-color:var(--green)}

  .calc{font-family:ui-monospace, SFMono-Regular, Menlo, monospace;font-size:13px;background:#f6f9fc;
    border:1px solid var(--line);border-radius:10px;padding:11px 13px;overflow-x:auto;white-space:pre;color:#33465b}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(12px);opacity:0;
    background:var(--navy);color:#fff;font-size:14px;padding:11px 18px;border-radius:11px;transition:.22s;
    z-index:100;max-width:90vw;text-align:center;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .modal-bg{position:fixed;inset:0;background:rgba(11,43,73,.42);z-index:80;display:grid;place-items:center;padding:18px}
  .modal{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:22px;box-shadow:0 24px 60px -20px rgba(11,43,73,.5)}
  .modal h3{font-size:17px;margin-bottom:8px;color:var(--navy)}
  .modal p{font-size:14.5px;color:#3c4b5c}

  .result-card{background:linear-gradient(160deg,#0b2b49 0%, #14507f 62%, #1163ad 100%);color:#fff;
    border-radius:18px;padding:24px;box-shadow:0 18px 40px -22px rgba(11,43,73,.8)}
  .result-card .rc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;opacity:.8}
  .result-card h2{font-size:22px;margin:10px 0 2px;letter-spacing:-.03em}
  .result-card .rsub{font-size:13.5px;opacity:.82}
  .result-card .rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin:18px 0 4px}
  .result-card .rgrid .k{font-size:11.5px;opacity:.72}
  .result-card .rgrid .v{font-size:19px;font-weight:800;letter-spacing:-.02em}
  .result-card .rline{border-top:1px solid rgba(255,255,255,.22);margin-top:16px;padding-top:14px;font-size:13px;opacity:.92}
  .result-card .slogan{margin-top:12px;font-size:15px;font-weight:600;line-height:1.55}

  .footer{margin-top:34px;text-align:center;font-size:12px;color:var(--muted2);line-height:1.7}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
<style>
  /* ================= 캐릭터 초상 ================= */
  .portrait{position:relative;border-radius:12px;overflow:hidden;background:#fbf7ee;border:1px solid #e7e0d2;
    aspect-ratio:4/3;display:grid;place-items:center;margin-bottom:10px}
  .portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
  .portrait .ph{display:none;text-align:center;padding:10px}
  .portrait .ph .ico{font-size:30px;line-height:1;margin-bottom:6px;opacity:.5}
  .portrait .ph .t{font-size:12px;color:#9a8f7c}
  .portrait.no-img img{display:none}
  .portrait.no-img .ph{display:block}
  .pick .portrait{aspect-ratio:16/10;margin:-4px 0 10px}
  .portrait.cover img{object-fit:cover;object-position:50% 16%}
  .portrait.face{aspect-ratio:1/1;width:100%;margin:0}
  .portrait.face img{object-fit:contain;object-position:50% 40%}
  .pk-body{min-width:0}
  @media(max-width:760px){
    .grid3{gap:10px}
    .pick{display:flex;gap:12px;align-items:stretch;padding:12px}
    .pick .portrait{width:106px;flex:none;aspect-ratio:1/1.22;margin:0}
    .pick .pk-body{flex:1;min-width:0;display:flex;flex-direction:column}
    .pick .who{margin-bottom:6px;min-height:0}
    .pick .mini{gap:2px 8px}
    .pick .first{margin-top:auto}
    .pick .head{flex-wrap:wrap;gap:6px}
  }
  .pick .diff{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
    color:#3d5166;background:#f0f5fa;border-radius:999px;padding:3px 9px;white-space:nowrap}
  .pick.on .diff{background:#e2eef9;color:var(--blue2)}
  .pick .own{font-size:12.5px;color:#4b5c70;margin:-2px 0 6px}
  .pick .own b{color:var(--navy);font-weight:700}
  .prof{width:74px;flex:none;border-radius:12px;overflow:hidden;border:1px solid #e7e0d2;background:#fbf7ee}
  .prof .portrait{border:0;border-radius:0;margin:0}

  /* ================= 공고문 문서 ================= */
  .doc{background:#fffdf8;border:1px solid #e3dccb;border-radius:10px;overflow:hidden;
    box-shadow:inset 0 0 0 4px #fffdf8, inset 0 0 0 5px #efe8d8;color:#26221c}
  .doc-head{padding:20px 18px 14px;text-align:center;border-bottom:2px solid #d8cfb9}
  .doc-org{font-size:12.5px;letter-spacing:.18em;color:#7a6f57}
  .doc-title{font-size:22px;font-weight:800;letter-spacing:.28em;margin:4px 0 2px;color:#1e1b15}
  .doc-sub{font-size:12px;color:#7a6f57}
  .doc-no{display:inline-block;margin-top:8px;font-size:12px;color:#5d5545;border:1px solid #d8cfb9;
    border-radius:5px;padding:2px 8px;background:#fbf7ec}
  .doc-body{padding:6px 18px 18px}
  .art{border-bottom:1px solid #ece5d4;padding:12px 0}
  .art:last-child{border-bottom:none}
  .art>h5{margin:0;font-size:14.5px;font-weight:700;color:#1e1b15;display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
  .art>h5 .tg{font-size:10.5px;color:#8a7f68;border:1px solid #ddd4bf;border-radius:4px;padding:0 4px;font-weight:600}
  .art>h5:after{content:"접기";margin-left:auto;font-size:11px;color:#9a8f78;font-weight:500}
  .art.closed>h5:after{content:"펼치기"}

const WD = ["일", "월", "화", "수", "목", "금", "토"];
const p2 = n => String(n).padStart(2, "0");
const won = n => Math.round(n).toLocaleString("ko-KR");
const wonP = n => Number(n).toLocaleString("ko-KR", { maximumFractionDigits: 2 });
const eok = n => {
  const v = Math.round(n);
  const s = v < 0 ? "-" : "";
  const a = Math.abs(v);
  if (a >= 100000000) {
    const e = Math.floor(a / 100000000), m = Math.round((a % 100000000) / 10000);
    return s + e + "억" + (m ? " " + m.toLocaleString("ko-KR") + "만" : "") + "원";
  }
  if (a >= 10000) return s + Math.round(a / 10000).toLocaleString("ko-KR") + "만원";
  return s + won(a) + "원";
};
const pct = (r, d = 2) => (r * 100).toFixed(d) + "%";
/* 추정가격은 부가가치세를 뺀 금액 (국가계약법 시행령 §9②) — 기초금액은 부가세를 더한 금액 */
const vatExcluded = n => Math.floor(n / 1.1);
const dISO = ms => { const d = new Date(ms); return d.getUTCFullYear() + "-" + p2(d.getUTCMonth() + 1) + "-" + p2(d.getUTCDate()); };
const fDate = ms => { const d = new Date(ms); return d.getUTCFullYear() + ". " + p2(d.getUTCMonth() + 1) + ". " + p2(d.getUTCDate()) + ". (" + WD[d.getUTCDay()] + ")"; };
const fDT = ms => { const d = new Date(ms); return fDate(ms) + " " + p2(d.getUTCHours()) + ":" + p2(d.getUTCMinutes()); };
const fTime = ms => p2(new Date(ms).getUTCHours()) + ":" + p2(new Date(ms).getUTCMinutes());
const addDays = (ms, d) => ms + d * 86400000;
const diffDays = (a, b) => Math.round((b - a) / 86400000);
const isBn = ms => { const w = new Date(ms).getUTCDay(); return w === 0 || w === 6 || HOLIDAYS.has(dISO(ms)); };
function addBizDays(ms, n) {
  let t = ms, c = 0, guard = 0;
  while (c < n && guard++ < 400) { t = addDays(t, 1); if (!isBn(t)) c++; }
  return t;
}
/* 주말·공휴일이면 다음 영업일 같은 시각으로 */
function nextBiz(ms) {
  let t = ms, guard = 0;
  while (isBn(t) && guard++ < 30) t = addDays(t, 1);
  return t;
}
/* a 다음날부터 b(마감일)까지 남은 영업일 수 — 토·일·공휴일은 세지 않는다 */
function bizDaysLeft(a, b) {
  let c = 0, t = a, guard = 0;
  while (t < b && guard++ < 400) { t = addDays(t, 1); if (t <= b && !isBn(t)) c++; }
  return c;
}
/* 주말·공휴일이면 그 앞 영업일로 — ‘14일 이내’ 같은 기한을 넘기지 않게 */
function prevBiz(ms) {
  let t = ms, guard = 0;
  while (isBn(t) && guard++ < 30) t = addDays(t, -1);
  return t;
}
/* 날짜만 보고 세는 D-day — 03.03 09:00 에서 03.06 마감이면 D-3 */
const dayKey = ms => { const d = new Date(ms); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); };
const dDay = (from, to) => Math.max(0, Math.round((dayKey(to) - dayKey(from)) / 86400000));
/* 받침에 따라 ‘로 / 으로’ */
function josaRo(word) {
  const s = String(word || "").trim();
  if (!s) return "로";
  const code = s.charCodeAt(s.length - 1);
  if (code < 0xac00 || code > 0xd7a3) return "로";
  const jong = (code - 0xac00) % 28;
  return (jong === 0 || jong === 8) ? "로" : "으로";
}

   판이 바뀌어 목록 순서가 돌아도 같은 공고의 마감은 같은 규칙을 따른다. */
const CLOSE_PLAN = [
  { d: 3, h: 11, m: 0 },
  { d: 4, h: 14, m: 0 },
  { d: 6, h: 10, m: 0 },
  { d: 5, h: 16, m: 0 }
];
function buildNotices() {
  const all = NOTICES[S.charId];
  const cut = (S.rounds % 2 === 0) ? 0 : 1;
  const rot = all.slice(cut).concat(all.slice(0, cut));
  const three = (S.mode === "quick" ? rot.slice(0, 2) : rot.slice(0, 3));
  const d = new Date(S.now);
  const mid = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 0, 0);
  S.notices = three.map(n => {
    const idx = all.findIndex(x => x.id === n.id);
    const plan = CLOSE_PLAN[idx % CLOSE_PLAN.length];
    const raw = mid + plan.d * 86400000 + plan.h * 3600000 + plan.m * 60000;
    return { nid: n.id, close: nextBiz(raw) };
  });
  S.noticeId = null;
  S.bid = null;
  S.watch = null;
  S.readOk = false;
}
const noticeDef = nid => NOTICES[S.charId].find(n => n.id === nid);
function noticeOf() {
  const it = S.notices.find(n => n.nid === S.noticeId);
  if (!it) return null;
  return Object.assign({}, noticeDef(it.nid), { close: it.close, nid: it.nid });
}

  const rows = [], need = n.need || {};
  if (need.capital) rows.push({ label: "자본금 " + eok(need.capital) + " 이상", ok: S.capital >= need.capital, mine: "내 자본 " + eok(S.capital) });
  if (need.perf) rows.push({ label: "최근 3년 실적 " + eok(need.perf) + " 이상", ok: S.perf >= need.perf, mine: "내 실적 " + (S.perf ? eok(S.perf) : "없음") });
  if (need.license) rows.push({ label: "건설업 등록(면허) 보유", ok: !!(S.license && S.license.indexOf("건설업") === 0), mine: S.license || "없음" });
  if (need.ownProd) rows.push({ label: "직접생산확인증명서 보유", ok: !!S.ownProd, mine: S.ownProd ? "보유 (유효기간 2년)" : "없음" });
  return rows;
}
const eligible = n => eligibility(n).every(r => r.ok);

/* =====================================================================
   [14] 개찰 계산
   ===================================================================== */
function makeRivals(n) {
  const c = CH(), cnt = int(c.rivals[0], c.rivals[1]), out = [];
  const used = new Set([S.company]);
  for (let i = 0; i < cnt; i++) {
    let nm = rivalName(S.charId), g = 0;
    while (used.has(nm) && g++ < 50) nm = rivalName(S.charId);
    used.add(nm);
    const r = rivalFloor(n) + Math.random() * RULES.rivalSpread;
    out.push({ name: nm, amount: Math.round(n.base * r / 1000) * 1000 });
  }
  return out;
}
/* 경쟁자의 최저 투찰률 — 예정가격이 최대 +2%까지 올라가도 하한 아래로 떨어지지 않는 선 */
function rivalFloor(n) { return n.lb * 1.02 + 0.008; }
function safeBand(n) {
  return { low: Math.ceil(n.base * (n.lb * 1.02 + 0.002) / 1000) * 1000,
           high: Math.floor(n.base * (n.lb * 1.02 + 0.007) / 1000) * 1000 };
}
function drawYejeong(n) {
  const prices = [];
  for (let i = 0; i < 15; i++) prices.push(Math.round(n.base * (1 + rnd(-0.02, 0.02)) / 1000) * 1000);
  const picks = S.bid.picks.slice();
  S.rivals.forEach(() => { picks.push(int(1, 15)); picks.push(int(1, 15)); });
  const cnt = {};
  picks.forEach(p => cnt[p] = (cnt[p] || 0) + 1);
  const order = Object.keys(cnt).map(Number).sort((a, b) => (cnt[b] - cnt[a]) || (a - b));
  const top = order.slice(0, 4), filled = top.slice();
  let g = 0;
  while (filled.length < 4 && g++ < 30) filled.push(int(1, 15));
  const list = filled.map(k => prices[k - 1]);
  const avg = list.reduce((s, v) => s + v, 0) / list.length;
  return { prices, picks, counts: cnt, top: filled, list, avg, yejeong: Math.ceil(avg) };
}
function priceScore(amount, yejeong) {
  const r = amount / yejeong * 100;
  return Math.max(0, Math.round((70 - 2 * Math.abs(90 - r)) * 100) / 100);
}
function lateFee(amount, rate, days) {
  const raw = Math.round(amount * rate * days), cap = Math.round(amount * RULES.lateCapRate);
  return { raw, cap, fee: Math.min(raw, cap), capped: raw > cap };
}

  return '<img class="' + (cls || "") + '" src="' + src + '" alt="' + c.shop + " " + c.owner + '"' +

  return Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
}

/* 입력한 금액의 비율·판정 — 값이 바뀔 때마다 다시 그린다 */
function bidJudgeHTML(n, amt) {
  amt = Math.floor(amt || 0);
  if (!n || !amt) return "";
  const cap = Math.floor(n.base * RULES.capRate), lbAmt = Math.ceil(n.base * n.lb);
  const rate = amt / n.base * 100;
  const bad = amt < lbAmt || amt >= cap;
  /* 하한·상한에 바짝 붙었을 때는 퍼센트 대신 몇 원 차이인지 적는다 */
  const dLb = amt - lbAmt, dCap = cap - amt;
  let edge = "";
  if (Math.abs(dLb) <= 1000) edge = " · 낙찰하한 " + won(lbAmt) + "원" + (dLb === 0 ? "과 같은 금액" : dLb > 0 ? "보다 " + won(dLb) + "원 위" : "보다 " + won(-dLb) + "원 아래");
  else if (Math.abs(dCap) <= 1000) edge = " · 102% 상한 " + won(cap) + "원" + (dCap > 0 ? "보다 " + won(dCap) + "원 아래" : "과 같은 금액 (접수 안 됨)");
  return '<div class="gauge"><i class="' + (bad ? "low" : "mid") + '" style="width:' + Math.min(100, Math.max(0, rate - 60) / 45 * 100) + '%"></i></div>' +
    '<div class="tiny" style="margin-top:6px;color:' + (bad ? "var(--red)" : "var(--green)") + '">' +
    "기초금액의 " + rate.toFixed(3) + "% (" + won(amt) + "원" + edge + ") · " +
    (amt < lbAmt ? "낙찰하한 아래 — 1순위여도 심사 대상이 아닙니다" : amt >= cap ? "102% 상한 초과 — 접수되지 않습니다 (게임 설정)" : "제출 가능한 구간입니다") + "</div>";
}
function bindBidInput() {
  const inp = document.getElementById("bidAmount");
  if (!inp) return;
  const apply = () => {
    const digits = inp.value.replace(/[^0-9]/g, "");
    const v = digits ? parseInt(digits, 10) : 0;
    S.bid.amount = v;
    const pretty = digits ? won(v) : "";
    if (inp.value !== pretty) inp.value = pretty;
    const wrap = document.getElementById("bidJudgeWrap");
    if (wrap) {
      wrap.innerHTML = bidJudgeHTML(noticeOf(), v);
      wrap.style.display = v ? "" : "none";
    }
  };
  inp.addEventListener("input", apply);
  inp.addEventListener("change", apply);
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { const b = document.querySelector('[data-act="submitBid"]'); if (b) b.click(); } });
}

function finishBid() {
  const n = noticeOf();
  const yej = S.draw.yejeong;
  const rows = [{ name: S.company, amount: S.bid.amount, mine: true }].concat(S.rivals);
  rows.sort((a, b) => a.amount - b.amount);
  rows.forEach(r => {
    r.rate = r.amount / yej;
    r.over = r.amount > yej;
    r.lbFail = r.rate < n.lb;
    r.valid = !r.over;
    r.invalid = false;
  });
  const mine = rows.find(r => r.mine);
  /* 산출내역서 미제출 → 무효 (공고문 10항, 시행규칙 §44) */
  if (S.careless) { mine.invalid = true; mine.valid = false; }
  let rk = 0;
  rows.forEach(r => { if (r.valid) r.rank = ++rk; });
  const qualified = rows.filter(r => r.valid && !r.lbFail);
  qualified.forEach((r, i) => r.qualRank = i + 1);

  let outcome;
  if (!rows.some(r => r.valid)) outcome = "유찰";
  else if (mine.invalid) outcome = "무효";
  else if (!mine.valid) outcome = "초과";
  else if (mine.lbFail) outcome = "하한미달";
  else if (qualified.length && qualified[0].mine) outcome = "1순위";
  else outcome = "탈락";

  const second = qualified.find(r => !r.mine);
  S.result = { yej, rows, mine, outcome, second, lb: n.lb, careless: !!S.careless, notifiedAt: S.now };
  S.phase = "open";
}

function commitName(name) {
  const c = CH();
  S.company = name;
  S.capital = c.start.capital;
  S.perf = c.start.perf;
  S.staff = c.start.staff;
  S.license = c.start.license;
  S.ownProd = c.start.ownProd;
  S.credit = c.credit;
  S.now = RULES.base;
  S.phase = "list";
  S.rounds = 0;
  buildNotices();
  stampFx("참가자격 등록 완료", esc(name) + " · " + c.name + " 업종으로 나라장터에 등록했습니다.", () => {
    S.screen = "dashboard";
    render();
  });
  S.screen = "name";
  render();
}
function gotoNextRound() {
  if (S.rounds >= ROUNDS()) { S.screen = "end"; S.phase = "end"; render(); return; }
  /* 판이 바뀌면 다음 영업일로 넘어간다 — 게임 시계가 흘러야 같은 공고의 마감도 날짜와 맞는다 */
  S.now = nextBiz(addDays(S.now, 1));
  buildNotices();
  S.phase = "list";
  S.screen = "list";
  render();
}

const ACT = {
  newGame: () => { const m = S.mode; S = freshState(); S.mode = m; S.screen = "sector"; render(); },
  continue: () => { const o = load(); if (o) { S = o; if (!S.learned) S.learned = []; render(); } },
  mode: el => { S.mode = el.dataset.v; render(); },
  pickChar: el => { S.charId = el.dataset.id; render(); },
  quiz: el => { S.quiz[+el.dataset.q] = el.dataset.v; render(); },
  toName: () => { S.screen = "name"; S.nameMode = "auto"; S.autoName = S.autoName || genName(S.charId); render(); },
  modeName: el => { S.nameMode = el.dataset.m; render(); },
  reroll: () => { S.autoName = genName(S.charId); render(); },
  useAuto: () => commitName(S.autoName),
  useManual: () => {
    const v = validateName(S.typedName);
    if (!v.ok) { toast(v.msg); return; }
    commitName(String(S.typedName).trim());
  },

  toDash: () => { S.screen = "dashboard"; S.phase = "list"; render(); },
  toList: () => { if (!S.notices.length) buildNotices(); S.screen = "list"; S.phase = "list"; render(); },
  openNotice: el => {
    S.noticeId = el.dataset.id; S.watch = null; S.readOk = false; S.bid = null; S.bondChoice = "memo";
    S.screen = "detail"; render();
  },
  bond: el => { S.bondChoice = el.dataset.v; render(); },
  watch: el => {
    if (!S.watch) return;
    S.watch.ans[+el.dataset.n] = el.dataset.v;
    if (watchDone()) S.readOk = true;
    render();
  },
  docAll: el => {
    document.querySelectorAll(".art").forEach(a => {
      if (el.dataset.v === "close") a.classList.add("closed"); else a.classList.remove("closed");
    });
  },
  docTop: () => { const d = document.querySelector(".doc"); if (d) d.scrollIntoView({ block: "start", behavior: "smooth" }); },
  apply: () => {
    S.phase = "bid";
    S.bid = { amount: 0, picks: [], step: "pick" };
    stampFx("참가 신청 접수", "입찰보증금 " + (S.bondChoice === "memo" ? "지급각서 제출 (면제)" : "현금 납부") + " · 이제 투찰 화면입니다.", () => {
      S.screen = "bid"; render();
    });
    S.screen = "bid";
  },
  applyCareless: () => {
    S.careless = true;
    S.phase = "bid";
    S.bid = { amount: 0, picks: [], step: "pick" };
    toast("공고문 조건을 짚지 않고 진행합니다. 다음 판에서 서류가 빠져 무효가 됩니다.");
    S.screen = "bid"; render();
  },
  toDetail: () => { S.screen = "detail"; render(); },
  pickNo: el => {
    if (!S.bid || S.bid.step !== "pick") return;
    const k = +el.dataset.k, i = S.bid.picks.indexOf(k);
    if (i >= 0) S.bid.picks.splice(i, 1);
    else if (S.bid.picks.length < 2) S.bid.picks.push(k);
    else { toast("예비가격번호는 2개까지만 뽑을 수 있습니다."); return; }
    if (S.bid.picks.length === 2) S.bid.step = "amount";
    render();
  },
  fill: el => {
    const n = noticeOf(), v = el.dataset.v;
    let amt = 0;
    if (v === "safe") { const sb = safeBand(n); amt = (sb.low + sb.high) / 2; }
    else if (v === "lb") amt = n.base * (n.lb + 0.001);
    else if (v === "mid") amt = n.base * 0.95;
    else if (v === "base") amt = n.base;
    else if (v === "under") amt = n.base * (n.lb - 0.03);
    else if (v === "over") amt = n.base * 1.03;
    S.bid.amount = Math.round(amt / 1000) * 1000;
    render();
  },
  submitBid: submitBid,
  undo: () => {
    if (S.undoLeft <= 0) { toast("되돌리기는 한 판에 한 번뿐입니다."); return; }
    S.undoLeft--;
    S.bid = null;
    S.screen = "detail";
    toast("참가 신청을 되돌렸습니다. 실제로는 투찰 후 되돌릴 수 없습니다.");
    render();
  },
  toQual: () => { S.qual = null; S.screen = "qual"; S.phase = "qual"; render(); },
  afterLose: () => { gotoNextRound(); },

  doc: el => {
    const i = +el.dataset.i;
    S.qual.docs[i] = !S.qual.docs[i];
    render();
  },
  submitQual: () => {
    const q = S.qual, R = S.result;
    const missing = q.docs.filter(x => !x).length;
    if (missing) {
      q.tried++;
      if (q.tried >= 2) {
        q.phase = "result"; q.failed = "docs";
        q.pricePart = priceScore(R.mine.amount, R.yej); q.score = 0;
        toast("서류를 두 번 놓쳤습니다. 차순위로 넘어갑니다.");
        render(); return;
      }
      q.fixDeadline = addDays(S.now, RULES.qualFixDays);
      toast("서류 " + missing + "개가 빠졌습니다. 7일 안에 보완하여 다시 내십시오.");
      render(); return;
    }
    q.pricePart = priceScore(R.mine.amount, R.yej);
    q.score = q.pricePart + RULES.nonPriceScore;
    q.phase = "result";
    /* 통과해야 낙찰자 확정 — 심사에 걸린 3영업일만큼 게임 시계도 흘러 낙찰자 결정 통지일이 된다 */
    if (q.score >= CH().qualScore) {
      S.now = addBizDays(S.now, RULES.qualReviewDays);
      R.awardedAt = S.now;
    }
    render();
  },
  delayQual: () => {
    const q = S.qual;
    if (bizDaysLeft(S.now, q.deadline) <= 0) {
      q.phase = "result"; q.score = 0; q.pricePart = 0; S.qual.failed = "late";
      toast("5영업일이 지났습니다. 서류를 내지 않아 차순위로 넘어갑니다.");
      render(); return;
    }
    S.now = addDays(S.now, 1);
    toast("하루 미뤘습니다. 남은 기한 " + bizDaysLeft(S.now, q.deadline) + "영업일" + (isBn(S.now) ? " (오늘은 토·일·공휴일이라 기한이 줄지 않습니다)" : ""));
    render();
  },
  reexam: () => { toast("재심사를 요청했습니다. 새 서류는 붙일 수 없어 결과는 그대로입니다."); S.qual.phase = "result"; render(); },
  giveUpQual: () => {
    S.sanctioned.push("계약 미체결 6개월");
    S.fails++;
    toast("적격심사를 포기했습니다. 차순위로 넘어가고 6개월 제재가 남습니다.");
    gotoNextRound();
  },
  toContract: () => { S.contract = null; S.screen = "contract"; S.phase = "contract"; render(); },
  promise: () => { S.contract.promised = !S.contract.promised; render(); },
  signContract: () => {
    const k = S.contract, c = CH(), n = noticeOf();
    k.cost = Math.round(k.amount * c.costRate);
    /* 계약일과 지정 납품일을 계약 시점에 고정한다 — 수행 화면의 지체일수가 이 날짜를 본다 */
    k.contractDay = S.now;
    k.deliverDays = n ? n.deliverDays : 30;
    /* 계약일부터 N일이 주말·공휴일이면 다음 영업일까지가 지정 납품일 */
    k.due = nextBiz(addDays(k.contractDay, k.deliverDays));
    if (!k.exempt) { S.capital -= k.bond; k.bondPaid = true; }
    k.done = true;
    document.getElementById("modal-root").innerHTML =
      '<div class="modal-bg"><div class="modal" style="max-width:360px;text-align:center">' +
      '<svg class="seal" width="120" height="70" viewBox="0 0 120 70" style="display:block;margin:0 auto 6px">' +
      '<text x="60" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#c0392b" font-family="serif">' + esc(S.company) + "</text>" +
      '<text x="60" y="58" text-anchor="middle" font-size="13" fill="#c0392b" font-family="serif">(인)</text></svg>' +
      "<h3>계약을 체결했습니다</h3><p class='tiny muted'>" + fDate(S.now) + " · 낙찰자 결정 통지 후 10일 이내</p></div></div>";
    setTimeout(() => {
      document.getElementById("modal-root").innerHTML = "";
      S.perform = null; S.screen = "perform"; S.phase = "perform"; render();
    }, 1200);
    S.capital -= 0;
  },
  giveUpContract: () => {
    const k = S.contract;
    const forfeit = Math.min(S.capital, k.bond);
    S.capital -= forfeit;
    S.sanctioned.push("계약 미체결 6개월");
    S.fails++;
    toast("계약을 포기했습니다. 보증금 상당액 " + eok(forfeit) + "을 물고 6개월 제재가 남습니다.");
    S.screen = "end"; S.phase = "end"; render();
  },

  work: el => {
    const p = S.perform, step = +el.dataset.step, c = CH(), k = S.contract;
    /* 계약기간(납기)을 실제로 쓰게 한다 — 날짜는 계약일에서 계산한다 */
    const len = k.deliverDays || 30;
    const from = k.contractDay || S.now;
    if (step === 1) { S.now = nextBiz(addDays(from, Math.max(1, Math.round(len * 0.33)))); p.step = 1; }
    else if (step === 2) { S.now = nextBiz(addDays(from, Math.max(2, Math.round(len * 0.7)))); p.step = 2; }
    else if (step === 3) {
      /* 자재 입고가 늦어 지정 납품일보다 사흘 늦게 납품 — 주말·공휴일이면 다음 영업일 */
      const planned = k.due ? nextBiz(addDays(k.due, 3)) : nextBiz(addDays(S.now, 3));
      p.actual = planned;
      S.now = planned;
      p.lateDays = k.due ? Math.max(1, diffDays(k.due, planned)) : 3;
      p.fee = lateFee(k.amount, c.lateRate, p.lateDays).fee;
      p.step = 3;
    } else if (step === 4) {
      p.inspAsk = S.now;
      p.inspDue = prevBiz(addDays(S.now, RULES.inspectDays));
      p.step = 4;
    }
    else if (step === 6) {
      const due = p.payDue || addBizDays(p.claimDay || S.now, RULES.payDays);
      S.now = due;
      S.capital += (k.amount - p.fee) - (k.cost || 0) + (k.bondPaid ? k.bond : 0);
      S.perf += k.amount;
      S.wins++;
      p.paid = due;
      p.step = 6;
    }
    render();
  },
  invoice: el => {
    const p = S.perform;
    p.invoice = el.dataset.v;
    /* 검사가 끝나는 날(=청구할 수 있는 날)을 기준으로 기한을 잡는다.
       검사 전에 낸 계산서는 반송되고, 반송일부터 다시 청구한 날까지는 지급기간에 넣지 않는다. */
    const done = p.inspDue || prevBiz(addDays(S.now, RULES.inspectDays));
    p.claimDay = p.invoice === "before" ? nextBiz(addDays(done, RULES.invoiceBounceDays)) : done;
    p.payDue = addBizDays(p.claimDay, RULES.payDays);
    S.now = p.claimDay;
    p.step = 5;
    render();
  },
  finishJob: () => { gotoNextRound(); },

  applyCert: () => {
    if (S.ownProd) return;
    S.ownProd = true;
    S.now = addDays(S.now, 7);
    buildNotices();
    toast("직접생산확인증명서를 받았습니다 (유효기간 2년). 이제 인쇄 공고에 참가할 수 있습니다.");
    render();
  },
  glossary: () => openGlossary(),
  closeModal: () => closeModal(),
  closeTerm: () => closeTerm(),
  nextTerm: () => {
    const rest = Array.from(new Set(Array.from(document.querySelectorAll(".term.new")).map(t => t.dataset.term)));
    closeTerm();
    if (rest.length) showTerm(rest[0]);
  },
  toEnd: () => { S.screen = "end"; S.phase = "end"; render(); },
  restart: () => {
    const id = S.charId, m = S.mode, name = S.company;
    S = freshState(); S.mode = m; S.charId = id; S.autoName = name; S.typedName = name;
    S.screen = "sector"; render();
  }
};

document.addEventListener("click", e => {
  const bg = e.target.closest(".modal-bg");
  const stop = e.target.closest("[data-stop]");
  if (bg && !stop) { closeModal(); return; }
  const sec = e.target.closest(".art > h5");
  if (sec && !e.target.closest(".term")) { sec.parentNode.classList.toggle("closed"); return; }
  const el = e.target.closest("[data-act]");
  if (!el) {
    const t = e.target.closest(".term");
    if (t) { showTerm(t.dataset.term); }
    return;
  }
  const act = el.dataset.act;
  if (act === "closeModal" && !el.classList.contains("modal-bg")) { closeModal(); return; }
  if (ACT[act]) { ACT[act](el, e); }
});

/* =====================================================================
   [33] 시작
   ===================================================================== */
(function boot() {
  const saved = load();
  S = saved || freshState();
  if (!S.learned) S.learned = [];
  if (S.screen && S.screen !== "end" && S.company) { render(); return; }
  S.screen = "intro";
  render();
})();
</script></body></html>
