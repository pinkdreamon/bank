/* =====================================================================
   [32] 조작 처리
   ===================================================================== */
function commitName(name) {
  const c = CH();
  S.company = name;
  S.capital = c.start.capital;
  S.perf = c.start.perf;
  S.staff = c.start.staff;
  S.license = c.start.license;
  S.ownProd = c.start.ownProd;
  S.credit = c.credit;
  S.now = RULES.base;
  S.phase = "list";
  S.rounds = 0;
  buildNotices();
  stampFx("참가자격 등록 완료", esc(name) + " · " + c.name + " 업종으로 나라장터에 등록했습니다.", () => {
    S.screen = "dashboard";
    render();
  }, "등록만으로 끝이 아닙니다. 공고의 마감 시각과 참가자격을 꼭 보세요.");
  S.screen = "name";
  render();
}
function gotoNextRound() {
  if (S.rounds >= ROUNDS()) { S.screen = "end"; S.phase = "end"; render(); return; }
  /* 판이 바뀌면 다음 영업일로 넘어간다 — 게임 시계가 흘러야 같은 공고의 마감도 날짜와 맞는다 */
  S.now = nextBiz(addDays(S.now, 1));
  buildNotices();
  S.phase = "list";
  S.screen = "list";
  render();
}

/* =====================================================================
   인트로 조작 — ACT 에 없는 이름만 쓴다 (스플래시·스토리 넘기기)
   ===================================================================== */
document.addEventListener("click", e => {
  const t = (e.target && e.target.closest) ? e.target.closest("[data-act]") : null;
  if (t) {
    const a = t.dataset.act;
    if (a === "splashGo") { if (GATE && BEAT === 0) { clearTimeout(window.__splashT); BEAT = 1; render(); } return; }
    if (a === "introNext") { if (GATE) { BEAT = Math.min(5, BEAT + 1); render(); } return; }
    if (a === "skipStory") { if (GATE) { BEAT = 5; render(); } return; }
    /* 개업 — 업종을 고르면 간판(회사 이름)을 걸고 나라장터에 등록한다 */
    if (a === "startBiz") { const c = charOf(S.charId); if (!c) return; S.autoName = c.shop; S.typedName = c.shop; S.screen = "name"; render(); return; }
    if (a === "fxGet") { closeModal(); return; }
    if ((a === "newGame" || a === "continue") && GATE) GATE = false;
  }
}, true);

const ACT = {
  newGame: () => { const m = S.mode; S = freshState(); S.mode = m; S.screen = "sector"; PG.key = ""; PG.i = 0; OPENING_STAGE = 1; render(); },
  continue: () => { const o = load(); if (o) { S = o; if (!S.learned) S.learned = []; render(); } },
  mode: el => { S.mode = el.dataset.v; render(); },
  pickChar: el => { S.charId = el.dataset.id; render(); },
  quiz: el => { S.quiz[+el.dataset.q] = el.dataset.v; render(); },
  toName: () => { S.screen = "name"; S.nameMode = "auto"; S.autoName = S.autoName || genName(S.charId); S.typedName = S.autoName; render(); },
  modeName: el => { S.nameMode = el.dataset.m; render(); },
  reroll: () => { S.autoName = genName(S.charId); S.typedName = S.autoName; render(); },
  useAuto: () => {
    const nm = String(S.typedName || "").trim();
    const v = validateName(nm);
    if (!v.ok) { toast(v.msg); return; }
    commitName(nm);
  },
  useManual: () => {
    const v = validateName(S.typedName);
    if (!v.ok) { toast(v.msg); return; }
    commitName(String(S.typedName).trim());
  },

  toDash: () => { S.screen = "dashboard"; S.phase = "list"; render(); },
  toList: () => { if (!S.notices.length) buildNotices(); S.screen = "list"; S.phase = "list"; render(); },
  openNotice: el => {
    S.noticeId = el.dataset.id; S.watch = null; S.readOk = false; S.bid = null; S.bondChoice = "memo";
    S.screen = "detail"; render();
  },
  /* 잠긴 공고를 눌렀을 때 — 고장처럼 보이지 않게 이유를 알려 준다 */
  lockedNotice: el => {
    const item = (S.notices || []).find(x => x.nid === el.dataset.id);
    const d = noticeDef(el.dataset.id);
    if (!d) { toast("지금은 열 수 없는 공고입니다."); return; }
    if (item && item.close <= S.now) { toast("마감된 공고입니다 · 다음 판에서 다시 도전하십시오."); return; }
    const miss = eligibility(d).filter(r => !r.ok).map(r => r.label);
    toast("자격 미달 — " + (miss.length ? miss.join(" · ") : "참가자격") + " · 회사 키우기에서 올릴 수 있습니다");
  },
  bond: el => { S.bondChoice = el.dataset.v; render(); },
  watch: el => {
    if (!S.watch) return;
    S.watch.ans[+el.dataset.n] = el.dataset.v;
    if (watchDone()) S.readOk = true;
    render();
  },
  docAll: el => {
    document.querySelectorAll(".art").forEach(a => {
      if (el.dataset.v === "close") a.classList.add("closed"); else a.classList.remove("closed");
    });
  },
  docTop: () => { const d = document.querySelector(".doc"); if (d) d.scrollIntoView({ block: "start", behavior: "smooth" }); },
  apply: () => {
    S.phase = "bid";
    S.bid = { amount: 0, picks: [], step: "pick" };
    stampFx("참가 신청 접수", "입찰보증금 " + (S.bondChoice === "memo" ? "지급각서 제출 (면제)" : "현금 납부") + " · 이제 투찰 화면입니다.", () => {
      S.screen = "bid"; render();
    }, "면제받아도 안 받은 게 아닙니다. 계약을 어기면 그 금액을 현금으로 청구합니다.");
    S.screen = "bid";
  },
  applyCareless: () => {
    S.careless = true;
    S.phase = "bid";
    S.bid = { amount: 0, picks: [], step: "pick" };
    toast("공고문 조건을 짚지 않고 진행합니다. 다음 판에서 서류가 빠져 무효가 됩니다.");
    S.screen = "bid"; render();
  },
  toDetail: () => { S.screen = "detail"; render(); },
  pickNo: el => {
    if (!S.bid || S.bid.step !== "pick") return;
    const k = +el.dataset.k, i = S.bid.picks.indexOf(k);
    if (i >= 0) S.bid.picks.splice(i, 1);
    else if (S.bid.picks.length < 2) S.bid.picks.push(k);
    else { toast("예비가격번호는 2개까지만 뽑을 수 있습니다."); return; }
    if (S.bid.picks.length === 2) S.bid.step = "amount";
    render();
  },
  fill: el => {
    const n = noticeOf(), v = el.dataset.v;
    let amt = 0;
    if (v === "safe") { const sb = safeBand(n); amt = (sb.low + sb.high) / 2; }
    else if (v === "lb") amt = n.base * (n.lb + 0.001);
    else if (v === "mid") amt = n.base * 0.95;
    else if (v === "base") amt = n.base;
    else if (v === "under") amt = n.base * (n.lb - 0.03);
    else if (v === "over") amt = n.base * 1.03;
    S.bid.amount = Math.round(n.base * (Math.round(amt / n.base * 10000 / 5) * 5) / 10000 / 1000) * 1000;
    render();
  },
  submitBid: submitBid,
  undo: () => {
    if (S.undoLeft <= 0) { toast("되돌리기는 한 판에 한 번뿐입니다."); return; }
    S.undoLeft--;
    S.bid = null;
    S.screen = "detail";
    toast("참가 신청을 되돌렸습니다. 실제로는 투찰 후 되돌릴 수 없습니다.");
    render();
  },
  toQual: () => { S.qual = null; S.screen = "qual"; S.phase = "qual"; render(); },
  afterLose: () => { gotoNextRound(); },

  doc: el => {
    const i = +el.dataset.i;
    S.qual.docs[i] = !S.qual.docs[i];
    render();
  },
  submitQual: () => {
    const q = S.qual, R = S.result;
    const missing = q.docs.filter(x => !x).length;
    if (missing) {
      q.tried++;
      if (q.tried >= 2) {
        q.phase = "result"; q.failed = "docs";
        q.pricePart = priceScore(R.mine.amount, R.yej); q.score = 0;
        toast("서류를 두 번 놓쳤습니다. 차순위로 넘어갑니다.");
        render(); return;
      }
      q.fixDeadline = addDays(S.now, RULES.qualFixDays);
      toast("서류 " + missing + "개가 빠졌습니다. 7일 안에 보완하여 다시 내십시오.");
      render(); return;
    }
    q.pricePart = priceScore(R.mine.amount, R.yej);
    q.score = q.pricePart + RULES.nonPriceScore;
    q.phase = "result";
    /* 통과해야 낙찰자 확정 — 심사에 걸린 3영업일만큼 게임 시계도 흘러 낙찰자 결정 통지일이 된다 */
    if (q.score >= CH().qualScore) {
      S.now = addBizDays(S.now, RULES.qualReviewDays);
      R.awardedAt = S.now;
    }
    render();
  },
  delayQual: () => {
    const q = S.qual;
    if (bizDaysLeft(S.now, q.deadline) <= 0) {
      q.phase = "result"; q.score = 0; q.pricePart = 0; S.qual.failed = "late";
      toast("5영업일이 지났습니다. 서류를 내지 않아 차순위로 넘어갑니다.");
      render(); return;
    }
    S.now = addDays(S.now, 1);
    toast("하루 미뤘습니다. 남은 기한 " + bizDaysLeft(S.now, q.deadline) + "영업일" + (isBn(S.now) ? " (오늘은 토·일·공휴일이라 기한이 줄지 않습니다)" : ""));
    render();
  },
  reexam: () => { toast("재심사를 요청했습니다. 새 서류는 붙일 수 없어 결과는 그대로입니다."); S.qual.phase = "result"; render(); },
  giveUpQual: () => {
    S.sanctioned.push("계약 미체결 6개월");
    S.fails++;
    toast("적격심사를 포기했습니다. 차순위로 넘어가고 6개월 제재가 남습니다.");
    gotoNextRound();
  },
  toContract: () => { S.contract = null; S.screen = "contract"; S.phase = "contract"; render(); },
  promise: () => { S.contract.promised = !S.contract.promised; render(); },
  signContract: () => {
    const k = S.contract, c = CH(), n = noticeOf();
    k.cost = Math.round(k.amount * c.costRate);
    /* 계약일과 지정 납품일을 계약 시점에 고정한다 — 수행 화면의 지체일수가 이 날짜를 본다 */
    k.contractDay = S.now;
    k.deliverDays = n ? n.deliverDays : 30;
    /* 계약일부터 N일이 주말·공휴일이면 다음 영업일까지가 지정 납품일 */
    k.due = nextBiz(addDays(k.contractDay, k.deliverDays));
    if (!k.exempt) { S.capital -= k.bond; k.bondPaid = true; }
    k.done = true;
    document.getElementById("modal-root").innerHTML =
      '<div class="modal-bg"><div class="modal" style="max-width:360px;text-align:center">' +
      '<svg class="seal" width="120" height="70" viewBox="0 0 120 70" style="display:block;margin:0 auto 6px">' +
      '<text x="60" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#c0392b" font-family="serif">' + esc(S.company) + "</text>" +
      '<text x="60" y="58" text-anchor="middle" font-size="13" fill="#c0392b" font-family="serif">(인)</text></svg>' +
      "<h3>계약을 체결했습니다</h3><p class='tiny muted'>" + fDate(S.now) + " · 낙찰자 결정 통지 후 10일 이내</p></div></div>";
    setTimeout(() => {
      document.getElementById("modal-root").innerHTML = "";
      S.perform = null; S.screen = "perform"; S.phase = "perform"; render();
    }, 1200);
    S.capital -= 0;
  },
  giveUpContract: () => {
    const k = S.contract;
    const forfeit = Math.min(S.capital, k.bond);
    S.capital -= forfeit;
    S.sanctioned.push("계약 미체결 6개월");
    S.fails++;
    toast("계약을 포기했습니다. 보증금 상당액 " + eok(forfeit) + "을 물고 6개월 제재가 남습니다.");
    S.screen = "end"; S.phase = "end"; render();
  },

  work: el => {
    const p = S.perform, step = +el.dataset.step, c = CH(), k = S.contract;
    /* 계약기간(납기)을 실제로 쓰게 한다 — 날짜는 계약일에서 계산한다 */
    const len = k.deliverDays || 30;
    const from = k.contractDay || S.now;
    if (step === 1) { S.now = nextBiz(addDays(from, Math.max(1, Math.round(len * 0.33)))); p.step = 1; }
    else if (step === 2) { S.now = nextBiz(addDays(from, Math.max(2, Math.round(len * 0.7)))); p.step = 2; }
    else if (step === 3) {
      /* 자재 입고가 늦어 지정 납품일보다 사흘 늦게 납품 — 주말·공휴일이면 다음 영업일 */
      const planned = k.due ? nextBiz(addDays(k.due, 3)) : nextBiz(addDays(S.now, 3));
      p.actual = planned;
      S.now = planned;
      p.lateDays = k.due ? Math.max(1, diffDays(k.due, planned)) : 3;
      p.fee = lateFee(k.amount, c.lateRate, p.lateDays).fee;
      p.step = 3;
    } else if (step === 4) {
      p.inspAsk = S.now;
      p.inspDue = prevBiz(addDays(S.now, RULES.inspectDays));
      p.step = 4;
    }
    else if (step === 6) {
      const due = p.payDue || addBizDays(p.claimDay || S.now, RULES.payDays);
      S.now = due;
      S.capital += (k.amount - p.fee) - (k.cost || 0) + (k.bondPaid ? k.bond : 0);
      S.perf += k.amount;
      S.wins++;
      p.paid = due;
      p.step = 6;
    }
    render();
  },
  invoice: el => {
    const p = S.perform;
    p.invoice = el.dataset.v;
    /* 검사가 끝나는 날(=청구할 수 있는 날)을 기준으로 기한을 잡는다.
       검사 전에 낸 계산서는 반송되고, 반송일부터 다시 청구한 날까지는 지급기간에 넣지 않는다. */
    const done = p.inspDue || prevBiz(addDays(S.now, RULES.inspectDays));
    p.claimDay = p.invoice === "before" ? nextBiz(addDays(done, RULES.invoiceBounceDays)) : done;
    p.payDue = addBizDays(p.claimDay, RULES.payDays);
    S.now = p.claimDay;
    p.step = 5;
    render();
  },
  finishJob: () => { gotoNextRound(); },

  applyCert: () => {
    if (S.ownProd) return;
    S.ownProd = true;
    S.now = addDays(S.now, 7);
    buildNotices();
    toast("직접생산확인증명서를 받았습니다 (유효기간 2년). 이제 인쇄 공고에 참가할 수 있습니다.");
    render();
  },
  glossary: () => openGlossary(),
  closeModal: () => closeModal(),
  closeTerm: () => closeTerm(),
  nextTerm: () => {
    const rest = Array.from(new Set(Array.from(document.querySelectorAll(".term.new")).map(t => t.dataset.term)));
    closeTerm();
    if (rest.length) showTerm(rest[0]);
  },
  toEnd: () => { S.screen = "end"; S.phase = "end"; render(); },
  restart: () => {
    const id = S.charId, m = S.mode, name = S.company;
    S = freshState(); S.mode = m; S.charId = id; S.autoName = name; S.typedName = name;
    S.screen = "sector"; render();
  }
};

document.addEventListener("click", e => {
  const bg = e.target.closest(".modal-bg");
  const stop = e.target.closest("[data-stop]");
  if (bg && !stop) { closeModal(); return; }
  const sec = e.target.closest(".art > h5");
  if (sec && !e.target.closest(".term")) { sec.parentNode.classList.toggle("closed"); return; }
  const el = e.target.closest("[data-act]");
  if (!el) {
    const t = e.target.closest(".term");
    if (t) { showTerm(t.dataset.term); }
    return;
  }
  const act = el.dataset.act;
  if (act === "closeModal" && !el.classList.contains("modal-bg")) { closeModal(); return; }
  if (ACT[act]) { ACT[act](el, e); }
});

/* =====================================================================
   [33] 시작
   ===================================================================== */
(function boot() {
  const saved = load();
  S = saved || freshState();
  if (!S.learned) S.learned = [];
  if (S.screen && S.screen !== "end" && S.company) { render(); return; }
  S.screen = "intro";
  render();
})();
</script></body></html>
