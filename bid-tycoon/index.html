<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>입찰 타이쿤 — 나라장터 입찰 한 바퀴</title>
<style>
  /* =====================================================================
     입찰 타이쿤 · GAME UI — 어두운 무대 · 금색 · 두꺼운 3D 버튼 · 캐릭터 상주
     모든 화면은 "무대(band) + HUD + 패널"로 구성된다.
     ===================================================================== */

/* ---------------------------------------------------------------
   [1] 규칙 수치 — 화면의 문서와 판정이 모두 이 값 하나를 본다
   --------------------------------------------------------------- */
  :root{
    --bg0:#05090f; --bg1:#0b1524; --bg2:#122036;
    --pnl:#152238; --pnl2:#1d2e4c; --pnl3:#243959;
    --edge:#2b4066; --edge2:#3d5a86;
    --gold:#ffc73a; --gold2:#ffa51f; --goldd:#b4711a; --goldsoft:#ffefc4;
    --mint:#33d69a; --mintd:#0d7d57;
    --sky:#4d9bff; --skyd:#1b52c0; --skysoft:#dbe9ff;
    --red:#ff5b4d; --redd:#9e261d;
    --txt:#eef4ff; --dim:#95aacb; --dim2:#6d84a8;
    --paper:#f6f1e3; --paper2:#efe7d3; --ink:#2a2417;
    --r:20px; --rb:16px;
    --sh:0 7px 0 rgba(2,6,12,.6), 0 20px 40px -20px #000;
    --gline:linear-gradient(180deg,rgba(255,199,58,.55),rgba(255,199,58,.12));
    font-size:17px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{overflow-x:clip}
  body{
    background:
      radial-gradient(900px 520px at 50% -180px, rgba(255,167,38,.16), transparent 70%),
      radial-gradient(800px 600px at 100% 10%, rgba(45,120,255,.16), transparent 65%),
      radial-gradient(700px 700px at 0% 90%, rgba(52,214,154,.08), transparent 60%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg0) 60%, #04080e 100%);
    background-attachment:fixed;
    color:var(--txt);
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    line-height:1.6; -webkit-text-size-adjust:100%;
    letter-spacing:-.015em; min-height:100vh; overflow-x:clip;
    word-break:keep-all; overflow-wrap:anywhere;
    padding-bottom:env(safe-area-inset-bottom);
  }
  body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.028) 0 1px, rgba(255,255,255,0) 1px 16px);
    -webkit-mask-image:radial-gradient(120% 90% at 50% 0%, #000 0%, rgba(0,0,0,.3) 55%, transparent 85%);
    mask-image:radial-gradient(120% 90% at 50% 0%, #000 0%, rgba(0,0,0,.3) 55%, transparent 85%)}
  #app{position:relative;z-index:1;max-width:1044px;margin:0 auto;padding:0 12px 34px}
  h1,h2,h3,h4,h5{margin:0;line-height:1.28;letter-spacing:-.03em}
  p{margin:0 0 10px}
  p:last-child{margin-bottom:0}
  a{color:#9fc4ff;text-decoration:none;border-bottom:1px dotted rgba(159,196,255,.6)}
  small{font-size:14px}
  .muted{color:var(--dim)}
  .tiny{font-size:13.5px;line-height:1.55}
  .nowrap{white-space:nowrap}
  .num{font-variant-numeric:tabular-nums}

  /* ============================ 3D 버튼 ============================ */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;
    font-family:inherit;font-weight:900;font-size:17px;letter-spacing:-.02em;color:#12233c;
    padding:0 22px;min-height:56px;border-radius:var(--rb);position:relative;
    background:linear-gradient(180deg,#ffd978 0%,var(--gold) 42%,var(--gold2) 100%);
    box-shadow:0 6px 0 var(--goldd), 0 14px 22px -10px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.7);
    text-shadow:0 1px 0 rgba(255,255,255,.35);
    transition:transform .07s, box-shadow .07s, filter .15s;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--goldd), 0 6px 12px -8px #000, inset 0 1px 0 rgba(255,255,255,.5)}
  .btn:hover{filter:brightness(1.05)}
  .btn:disabled{filter:grayscale(.75) brightness(.72);box-shadow:0 6px 0 #0c1626;cursor:not-allowed;transform:none}
  .btn.big-btn{min-height:64px;font-size:19px;border-radius:20px;width:100%}
  .btn.wide{width:100%}
  .btn.subtle{background:linear-gradient(180deg,#2a3f61,#1a2b45);color:#cfe0f8;text-shadow:none;
    box-shadow:0 6px 0 #0c1626, inset 0 1px 0 rgba(255,255,255,.12);border:2px solid #38517a}
  .btn.subtle:active{box-shadow:0 2px 0 #0c1626}
  .btn.ghost{background:linear-gradient(180deg,#20304c,#16243a);color:#cfe0f8;text-shadow:none;
    box-shadow:0 6px 0 #0a1220, inset 0 0 0 2px #3d5a86}
  .btn.ghost:active{box-shadow:0 2px 0 #0a1220}
  .btn.danger{background:linear-gradient(180deg,#ff8878,#e03a2b);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35);
    box-shadow:0 6px 0 var(--redd), 0 14px 22px -12px #000}
  .btn.sm{min-height:46px;font-size:15px;padding:0 16px;border-radius:14px}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .btn-row.actions{flex-direction:column;gap:10px;margin-top:18px}
  .btn-row > .btn{flex:1 1 auto}
  @media(min-width:560px){.btn-row.actions{flex-direction:row}.btn-row.actions .big-btn{flex:2 1 auto}}

  /* ============================ HUD ============================ */
  .hud{position:sticky;top:0;z-index:60;margin:0 -12px;padding:8px 12px 9px;
    background:linear-gradient(180deg,rgba(19,32,57,.98),rgba(9,16,28,.98));
    border-bottom:3px solid #000;
    box-shadow:0 10px 24px -12px #000, inset 0 1px 0 rgba(255,199,58,.28), inset 0 -2px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(8px)}
  .hud:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;
    background:linear-gradient(90deg,transparent,rgba(255,199,58,.85),transparent)}
  .hud-in{max-width:1020px;margin:0 auto;display:flex;align-items:center;gap:9px}
  .hero{display:flex;align-items:center;gap:9px;min-width:0;flex:1 1 auto}
  .hero-ava{position:relative;width:48px;height:48px;border-radius:15px;flex:none;
    background:linear-gradient(180deg,#ffe9b0,#f3d089);border:2.5px solid var(--gold);
    box-shadow:0 0 0 2px rgba(0,0,0,.55), 0 0 14px rgba(255,199,58,.35);overflow:visible}
  .hero-ava img{width:100%;height:100%;object-fit:cover;object-position:50% 14%;border-radius:12px;display:block}
  .hero-ava .lv{position:absolute;right:-6px;bottom:-6px;font-size:10px;font-weight:900;color:#25190a;
    background:linear-gradient(180deg,#ffd978,var(--gold2));border:1.5px solid #8a5a12;border-radius:8px;
    padding:0 5px;line-height:15px;letter-spacing:0}
  .hero-id{min-width:0}
  .hero-id b{display:block;font-size:16px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:44vw;line-height:1.24;letter-spacing:-.03em}
  .hero-id small{display:block;font-size:11.5px;color:var(--dim2);font-weight:800;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:50vw}
  .purse{display:flex;align-items:center;gap:7px;padding:3px 11px 4px;border-radius:14px;flex:none;
    background:linear-gradient(180deg,#233757,#16243a);
    border:2px solid #435e8c;box-shadow:inset 0 2px 0 rgba(255,255,255,.09), 0 3px 0 #060c16}
  .purse small{display:block;font-size:10px;font-weight:900;color:#b9c9e3;letter-spacing:.06em;line-height:1.15}
  .purse b{display:block;font-size:18px;font-weight:900;color:#ffdc7a;line-height:1.2;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-shadow:0 0 14px rgba(255,199,58,.45)}
  .coin{display:block;width:20px;height:20px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 34% 28%,#fff2c0,#ffc73a 55%,#c9820f 100%);
    border:1.5px solid #8f5d0c;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
  .coin:after{content:"₩";display:block;text-align:center;font-size:11px;font-weight:900;color:#7c4f06;line-height:17px}
  .hchip{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);
    border:2px solid #33486c;border-radius:13px;padding:3px 10px 4px;min-height:42px;flex:none}
  .hchip .hk{font-size:10px;font-weight:900;color:#9fb2d0;letter-spacing:.04em;line-height:1.1}
  .hchip .hv{font-size:16px;font-weight:900;color:#fff;line-height:1.2;font-variant-numeric:tabular-nums}
  .hchip.btnchip{cursor:pointer;font-family:inherit;color:#ffdc7a;
    background:linear-gradient(180deg,rgba(255,199,58,.22),rgba(255,160,30,.1));border-color:#8a6a24}
  .hchip.btnchip .hv{font-size:14px;color:#ffdc7a}
  .hearts{display:inline-flex;gap:2px;align-items:center;line-height:1}
  .hearts i{display:block;width:14px;height:14px;flex:none;
    clip-path:path("M7.5 13.6C3.2 10.6 .8 8.1 .8 5.2 .8 2.9 2.5 1.2 4.7 1.2c1.2 0 2.2 .6 2.8 1.5 .6-.9 1.6-1.5 2.8-1.5 2.2 0 3.9 1.7 3.9 4 0 2.9-2.4 5.4-6.7 8.4z");
    background:linear-gradient(180deg,#ff9d92,#e8443a)}
  .hearts i.off{background:#3c4c68}
  .xpbar{max-width:1020px;margin:7px auto 0;height:7px;border-radius:99px;background:rgba(0,0,0,.5);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.8);position:relative;overflow:visible}
  .xpbar i{display:block;height:100%;border-radius:99px;
    background:linear-gradient(90deg,var(--gold2),#ffe08a);box-shadow:0 0 10px rgba(255,199,58,.7);
    transition:width .6s cubic-bezier(.2,.9,.2,1)}
  .xpbar b{position:absolute;right:0;top:-19px;font-size:11px;font-weight:900;color:#ffd76e}
  @media(max-width:620px){
    .hud-in{flex-wrap:wrap;gap:7px}
    .hero{flex:1 1 100%}
    .hero-id b{max-width:58vw;font-size:15.5px}
    .hud .purse{flex:1 1 auto}
    .hud .purse b{font-size:16.5px}
    .hchip{flex:1 1 auto;justify-content:center;min-height:38px;padding:2px 8px 3px}
    .hchip .hv{font-size:15px}
    .hchip.btnchip{flex:0 0 auto}
    .hearts i{width:12px;height:12px}
    .xpbar b{display:none}
  }

  /* ============================ 9단계 트랙 ============================ */
  .stepbar{margin:11px 0 0;padding:9px 10px 8px;border-radius:16px;
    background:linear-gradient(180deg,rgba(24,38,62,.95),rgba(12,20,34,.95));
    border:2.5px solid #2b4066;box-shadow:0 5px 0 #050a12, inset 0 1px 0 rgba(255,255,255,.07)}
  .stepbar .top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .stepbar .now{font-size:13px;font-weight:900;color:#ffdc7a;letter-spacing:-.01em}
  .stepbar .cnt{margin-left:auto;font-size:11.5px;font-weight:900;color:#93a7c6;letter-spacing:.04em}
  .strack{height:10px;border-radius:99px;background:#0a1220;overflow:hidden;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.06)}
  .strack i{display:block;height:100%;border-radius:99px;
    background:linear-gradient(90deg,#ffa51f,#ffd76e 70%,#fff0c0);
    box-shadow:0 0 12px rgba(255,199,58,.85);transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .snodes{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:8px 1px 2px}
  .snodes::-webkit-scrollbar{display:none}
  .snodes .s{flex:none;display:inline-flex;align-items:center;gap:5px;padding:3px 8px 3px 3px;
    border-radius:99px;background:#101d30;border:2px solid #24334d;font-size:12px;color:#6d84a8;white-space:nowrap}
  .snodes .s b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#1a2a42;
    border:1.5px solid #2b4066;font-size:11px;color:#7f93b3;font-weight:900}
  .snodes .s em{font-style:normal;font-weight:800}
  .snodes .s.done{color:#8ff0c6;border-color:#1c6f52;background:#0d2a22}
  .snodes .s.done b{background:var(--mint);border-color:#0a6a4a;color:#04231a}
  .snodes .s.now{color:#3a2800;border-color:var(--gold);background:linear-gradient(180deg,#ffe1a0,var(--gold));
    box-shadow:0 0 16px rgba(255,199,58,.55);padding-right:11px}
  .snodes .s.now b{background:#3a2800;border-color:#3a2800;color:var(--gold);animation:nodePulse 1.8s ease-in-out infinite}
  @keyframes nodePulse{0%,100%{box-shadow:0 0 0 0 rgba(255,199,58,.75)}50%{box-shadow:0 0 0 7px rgba(255,199,58,0)}}
  @media(max-width:700px){
    .snodes .s:not(.now) em{display:none}
    .snodes .s:not(.now){padding:3px}
    .snodes .s.now em{font-size:12px}
  }

  /* ============================ 목표 말풍선 ============================ */
  .objbar{display:flex;align-items:center;gap:10px;margin:11px 0 0;padding:9px 13px 9px 9px;
    border-radius:18px;position:relative;
    background:linear-gradient(180deg,#20324f,#16243a);border:2.5px solid #3d5a86;
    box-shadow:0 5px 0 #050a12, inset 0 1px 0 rgba(255,255,255,.1);font-size:14.5px;font-weight:700;color:#dbe9ff}
  .objbar:after{content:"";position:absolute;left:26px;bottom:-9px;width:14px;height:14px;
    background:#16243a;border-right:2.5px solid #3d5a86;border-bottom:2.5px solid #3d5a86;
    transform:rotate(45deg)}
  .objbar .bull{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:11px;
    background:linear-gradient(180deg,#ffe1a0,var(--gold));color:#3a2800;font-size:15px;font-weight:900;
    box-shadow:0 2px 0 #8a5a12, inset 0 1px 0 rgba(255,255,255,.6)}
  .objbar b{color:#ffdc7a;font-weight:900}
  .objbar .go{margin-left:auto;font-size:12px;font-weight:900;color:#3a2800;background:var(--gold);
    border-radius:99px;padding:2px 9px;white-space:nowrap;letter-spacing:-.02em}

  /* ============================ 무대(band) ============================ */
  .band{position:relative;margin:12px 0 0;border-radius:22px;overflow:hidden;min-height:164px;
    border:3px solid #24395c;box-shadow:var(--sh);background:#0b1524;isolation:isolate}
  .band-art{position:absolute;inset:0;z-index:0}
  .band-art .sp{position:absolute;left:50%;top:-40%;width:80%;height:150%;transform:translateX(-50%);
    background:radial-gradient(ellipse at 50% 20%, rgba(255,214,140,.22), transparent 62%);pointer-events:none}
  .band-art .wall{position:absolute;inset:0;
    background:linear-gradient(180deg,#16253d 0%,#101c30 58%,#0a1220 100%)}
  .band-art .flo{position:absolute;left:0;right:0;bottom:0;height:34%;
    background:linear-gradient(180deg,#1b2a42,#0c1524);border-top:3px solid rgba(255,199,58,.16)}
  .band-art .win{position:absolute;left:16px;top:14px;width:66px;height:46px;border-radius:6px;
    background:linear-gradient(180deg,#26456f,#12253f);border:2px solid #35507a;
    box-shadow:inset 0 0 20px rgba(120,180,255,.35)}
  .band-art .win:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#35507a}
  .band-art .win:before{content:"";position:absolute;top:50%;left:0;right:0;height:2px;background:#35507a}
  .band-art .note{position:absolute;width:42px;height:52px;border-radius:4px;background:#e8dfc8;
    box-shadow:0 3px 8px rgba(0,0,0,.5);transform:rotate(-4deg)}
  .band-art .note:after{content:"";position:absolute;left:6px;right:6px;top:9px;height:2px;
    background:#b9ad91;box-shadow:0 7px 0 #b9ad91,0 14px 0 #b9ad91,0 21px 0 #b9ad91}
  .band-art .note.n2{width:38px;height:46px;transform:rotate(5deg)}
  .band-art .pin{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--red);
    border:1px solid #6d1a13;box-shadow:0 1px 2px rgba(0,0,0,.6)}
  .band-art .board{position:absolute;left:14px;top:14px;width:150px;height:96px;border-radius:8px;
    background:linear-gradient(180deg,#7a5a35,#5a4023);border:3px solid #3d2c17;
    box-shadow:inset 0 0 20px rgba(0,0,0,.5)}
  .band-art .vault{position:absolute;left:auto;right:36%;bottom:46px;width:70px;height:56px;border-radius:9px;
    background:linear-gradient(180deg,#3c4d68,#212f45);border:3px solid #51678a;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.16), 0 6px 14px rgba(0,0,0,.6)}
  .band-art .vault:after{content:"";position:absolute;left:50%;top:50%;width:30px;height:30px;
    margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #ffd76e;
    box-shadow:0 0 12px rgba(255,199,58,.6), inset 0 0 8px rgba(255,199,58,.4)}
  .band-art .curt{position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,#5a1220 0 16px,#74182a 16px 32px);opacity:.92}
  .band-art .bar{position:absolute;left:0;right:0;top:0;height:26px;
    background:linear-gradient(180deg,#8f6b2a,#5c4218);border-bottom:2px solid #2d1f07}
  .band-fig{position:absolute;right:10px;bottom:0;width:132px;height:150px;z-index:2;
    filter:drop-shadow(0 8px 16px rgba(0,0,0,.7))}
  .band-fig img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;
    border-radius:16px 16px 0 0;border:3px solid var(--gold);border-bottom:0;
    background:#f6f1e3;animation:bob 3.4s ease-in-out infinite}
  .band-cap{position:absolute;left:10px;bottom:9px;z-index:3;display:flex;flex-direction:column;gap:3px;
    max-width:calc(100% - 156px);padding:5px 9px 5px 4px;border-radius:14px;
    background:linear-gradient(90deg,rgba(3,8,16,.72),rgba(3,8,16,0))}
  .band-cap .bk{font-size:12px;font-weight:900;color:#3a2800;background:var(--gold);
    border-radius:99px;padding:2px 10px;align-self:flex-start;letter-spacing:-.02em;
    box-shadow:0 2px 0 #8a5a12}
  .band-cap .bs{font-size:15px;font-weight:900;color:#fff;text-shadow:0 2px 8px #000, 0 1px 0 #000}
  .band.b-board .band-art .wall{background:linear-gradient(180deg,#1a3153,#0e1e34 70%,#0a1322)}
  .band.b-open .band-art .wall{background:linear-gradient(180deg,#0e2036,#08131f)}
  .band.b-office .band-art .wall{background:linear-gradient(180deg,#1d2a3d,#121c2c 60%,#0b131f)}
  @media(max-width:520px){
    .band{min-height:150px}
    .band-fig{width:112px;height:128px}
    .band-cap{max-width:calc(100% - 132px)}
    .band-cap .bs{font-size:14px}
    .band-art .board{width:112px;height:74px}
    .band-art .win{right:18%;width:60px;height:44px}
  }

  /* ============================ 패널 ============================ */
  .card{position:relative;background:linear-gradient(180deg,var(--pnl2),var(--pnl));
    border:2.5px solid var(--edge);border-radius:var(--r);padding:15px;
    box-shadow:0 6px 0 rgba(2,6,12,.55), inset 0 1px 0 rgba(255,255,255,.07);
    margin-top:12px}
  .card.tight{padding:12px}
  .card.flat{box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
  .card.lit{border-color:#5b7ba8;box-shadow:0 6px 0 rgba(2,6,12,.55), 0 0 24px -6px rgba(90,150,255,.5)}
  .card-title{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:900;margin-bottom:11px;
    color:#eaf3ff;letter-spacing:-.03em;line-height:1.35;flex-wrap:wrap}
  .card-title .ico{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;
    background:linear-gradient(180deg,#ffe1a0,var(--gold));border:2px solid #8a5a12;
    font-size:14px;font-weight:900;color:#3a2800;box-shadow:0 2px 0 #6d4408}
  .sec-head{display:flex;align-items:baseline;gap:10px;margin:16px 2px 8px;flex-wrap:wrap}
  .sec-head h2{font-size:22px;font-weight:900;letter-spacing:-.04em;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .sec-head .hint{font-size:13px;color:var(--dim);font-weight:800}
  .big{font-size:24px;font-weight:900;letter-spacing:-.04em;color:#fff;font-variant-numeric:tabular-nums}
  .foot-note{margin-top:12px;font-size:11.5px;color:#5f7799;line-height:1.5;text-align:center}

  /* 상태 박스 */
  .good,.bad,.warn,.note{position:relative;border-radius:14px;padding:11px 13px;font-size:14.5px;
    line-height:1.6;border:2px solid;margin:10px 0 0}
  .good{background:rgba(51,214,154,.12);border-color:#1f8f68;color:#a9f3d4}
  .bad{background:rgba(255,91,77,.13);border-color:#9e261d;color:#ffc3bd}
  .warn{background:rgba(255,199,58,.12);border-color:#a37a1c;color:#ffe6a8}
  .note{background:rgba(120,160,220,.1);border-color:#38517a;color:#c4d8f6}
  .good b,.bad b,.warn b,.note b{color:#fff}
  .calc{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,"D2Coding",monospace;
    font-size:12.5px;line-height:1.75;background:#08101c;border:2px solid #24344f;border-radius:13px;
    padding:10px 12px;color:#a8e6c9;overflow-x:auto;margin-top:10px}

  /* 통계 */
  .statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  @media(min-width:620px){.statgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .stat{position:relative;background:linear-gradient(180deg,#0f1c2e,#0a1320);border:2px solid #24344f;
    border-radius:14px;padding:9px 11px;overflow:hidden}
  .stat:after{content:"";position:absolute;left:0;right:0;top:0;height:2px;
    background:linear-gradient(90deg,rgba(255,199,58,.5),transparent)}
  .stat .k{font-size:11.5px;font-weight:900;color:#8ba1c2;letter-spacing:.02em}
  .stat .v{font-size:19px;font-weight:900;color:#fff;letter-spacing:-.03em;line-height:1.35;
    font-variant-numeric:tabular-nums}
  .stat .v small{font-size:12px;font-weight:800;color:#93a7c6;margin-left:2px}
  .stat.rel .v{color:#ffdc7a;text-shadow:0 0 16px rgba(255,199,58,.4)}
  .stat .delta{position:absolute;right:9px;top:6px;font-size:13px;font-weight:900;color:var(--mint);
    animation:deltaUp 1.7s ease-out forwards;pointer-events:none}
  .stat .delta.down{color:#ff8b80}
  @keyframes deltaUp{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}

  /* 선택지 */
  .opts{display:flex;gap:8px;flex-wrap:wrap}
  .opt{cursor:pointer;font-family:inherit;font-weight:800;font-size:14.5px;color:#cfe0f8;
    background:linear-gradient(180deg,#23344f,#182640);border:2px solid #33486c;border-radius:14px;
    padding:9px 14px;min-height:46px;box-shadow:0 4px 0 #070d18;transition:transform .07s,box-shadow .07s;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:left}
  .opt:active{transform:translateY(3px);box-shadow:0 1px 0 #070d18}
  .opt.on{background:linear-gradient(180deg,#ffe1a0,var(--gold));border-color:#8a5a12;color:#3a2800;
    box-shadow:0 4px 0 #8a5a12;font-weight:900}
  .opt.right{background:linear-gradient(180deg,#4ee0a8,#1aa876);border-color:#0a6a4a;color:#04231a;box-shadow:0 4px 0 #0a6a4a}
  .opt.wrong{background:linear-gradient(180deg,#ff9186,#d63a2c);border-color:#8e221a;color:#fff;box-shadow:0 4px 0 #8e221a;
    text-decoration:line-through}
  .chip{cursor:pointer;font-family:inherit;font-weight:900;font-size:13px;color:#cfe0f8;
    background:linear-gradient(180deg,#22334e,#17243a);border:2px solid #33486c;border-radius:999px;
    padding:7px 12px;min-height:38px;box-shadow:0 3px 0 #070d18}
  .chip:active{transform:translateY(2px);box-shadow:0 1px 0 #070d18}
  .pricechips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}

  /* 표 */
  .tw{overflow-x:auto;border-radius:14px;border:2px solid #24344f;background:#0a1320}
  .tw table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:420px}
  .tw th,.tw td{padding:8px 10px;text-align:left;border-bottom:1px solid #1d2b42;color:#dbe9ff}
  .tw thead th{background:#132239;color:#9fb2d0;font-size:11.5px;font-weight:900;letter-spacing:.02em;
    position:sticky;top:0}
  .tw tbody tr:last-child td{border-bottom:none}
  .tw td.r{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
  .tw tr.mine td{background:rgba(255,199,58,.12);color:#ffe6a8;font-weight:900}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
  .kv dt{color:#8ba1c2;font-weight:800;white-space:nowrap}
  .kv dd{margin:0;color:#eaf3ff;font-weight:700}
  @media(max-width:430px){.kv{grid-template-columns:1fr}.kv dt{margin-top:5px}}

  /* 태그 */
  .tag{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:900;padding:2px 8px;
    border-radius:999px;background:#1f3049;color:#c3d6f2;border:1.5px solid #38517a;letter-spacing:-.01em}
  .tag.blue{background:rgba(77,155,255,.18);border-color:#3a72c8;color:#bcd9ff}
  .tag.green{background:rgba(51,214,154,.16);border-color:#1f8f68;color:#8ff0c6}
  .tag.red{background:rgba(255,91,77,.16);border-color:#9e261d;color:#ffc3bd}
  .tag.amber{background:rgba(255,199,58,.16);border-color:#a37a1c;color:#ffe6a8}
  .tag.line{background:transparent;border-style:dashed}

  /* 용어 */
  .term{display:inline;font-family:inherit;font-size:inherit;font-weight:900;color:#ffe08a;
    background:none;border:0;border-bottom:2px dotted rgba(255,208,110,.75);padding:0 1px;cursor:pointer}
  .term.new{animation:termGlow 1.6s ease-in-out infinite}
  @keyframes termGlow{0%,100%{border-bottom-color:rgba(255,208,110,.4)}50%{border-bottom-color:#ffe08a}}
  .termbox{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(520px,calc(100% - 20px));
    z-index:90;background:linear-gradient(180deg,#22344f,#131e31);border:3px solid var(--gold);
    border-radius:18px;padding:14px 15px 12px;box-shadow:0 10px 0 #060c16, 0 0 0 3px rgba(0,0,0,.5), 0 24px 50px -20px #000;
    animation:popIn .3s cubic-bezier(.2,1.3,.4,1) both;max-height:74vh;overflow:auto}
  .termbox .tb-k{font-size:11px;font-weight:900;color:#3a2800;background:var(--gold);border-radius:99px;
    padding:2px 9px;display:inline-block;margin-bottom:7px}
  .termbox h4{font-size:19px;margin-bottom:6px;color:#fff}
  .termbox .tb-s{font-size:14.5px;color:#ffe6a8;font-weight:800;margin-bottom:8px}
  .termbox .tb-d p{font-size:13.5px;color:#c4d8f6;margin-bottom:6px}
  .termbox .tb-a{margin-top:9px;font-size:11.5px;color:#8ba1c2;background:#0a1320;border:2px solid #24344f;
    border-radius:12px;padding:9px 10px;line-height:1.6}
  .termbox .tb-a b{color:#ffe08a;font-size:12.5px}
  .termbox .tb-b{display:flex;gap:8px;margin-top:10px}
  .termbox .tb-b .btn{flex:1;min-height:48px}
  .gl{list-style:none;margin:0;padding:0}
  .gl li{border-bottom:1px solid #24344f;padding:9px 0}
  .gl .gt{font-weight:900;color:#ffe08a;font-size:15px}
  .gl .gs{font-size:13.5px;color:#c4d8f6}
  .gl .gw{font-size:11.5px;color:#6d84a8;margin-top:2px}
  .empty{color:#6d84a8;font-size:13.5px}

  /* ============================ 무대 애니메이션(장면 SVG) ============================ */
  .scene{--p:0;position:relative;border-radius:16px;overflow:hidden;border:2.5px solid #24344f;
    background:linear-gradient(180deg,#eef4fb,#f7fafd);margin:12px auto;box-shadow:0 5px 0 #050a12;max-width:640px}
  .scene svg{display:block;width:100%;height:auto}
  .scene .cap{position:absolute;left:9px;bottom:8px;font-size:12px;color:#2a2417;
    background:rgba(255,255,255,.94);border-radius:9px;padding:3px 9px;font-weight:800;border:1.5px solid #d8cfb6}
  .scene .badge{position:absolute;right:9px;top:8px;font-size:11.5px;font-weight:900;color:#0a5c3b;
    background:rgba(255,255,255,.94);border:2px solid #bfe3d0;border-radius:999px;padding:2px 9px}
  .sx,.sy,.syin,.sc{transform-box:fill-box;transition:transform .95s cubic-bezier(.22,.8,.2,1), opacity .55s ease}
  .sx{transform-origin:left center;transform:scaleX(var(--p))}
  .sy{transform-origin:center bottom;transform:scaleY(var(--p))}
  .syin{transform-origin:center top;transform:scaleY(var(--p))}
  .roll{transform-box:fill-box;transform-origin:center;transform:scale(calc(1 - var(--p)*.52));transition:transform 1.1s ease}
  .fade{transition:opacity .55s ease;opacity:max(0,min(1,calc((var(--p) - var(--from,0)) * var(--k,4))))}
  .slide{transform-box:fill-box;transition:transform .8s cubic-bezier(.22,.8,.2,1), opacity .5s ease;
    opacity:max(0,min(1,calc((var(--p) - var(--from,0)) * var(--k,4))));
    transform:translate(calc((1 - min(1,max(0,calc((var(--p) - var(--from,0)) * var(--k,4))))) * 26px), calc((1 - min(1,max(0,calc((var(--p) - var(--from,0)) * var(--k,4))))) * 26px))}
  @keyframes spinRoll{to{transform:rotate(360deg)}}
  .rot{animation:spinRoll 1.9s linear infinite;transform-box:fill-box;transform-origin:center}
  .rot.fast{animation-duration:.9s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .bob{animation:bob 2.4s ease-in-out infinite}
  @keyframes glowPulse{0%,100%{opacity:.55}50%{opacity:1}}
  .glow{animation:glowPulse 1.8s ease-in-out infinite}
  @keyframes craneSwing{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
  .crane{transform-box:fill-box;transform-origin:bottom center;animation:craneSwing 4.5s ease-in-out infinite}

  /* ============================ 공고문(종이) ============================ */
  .doc{background:var(--paper);color:var(--ink);border-radius:14px;overflow:hidden;margin-top:10px;
    box-shadow:0 10px 26px -12px #000, inset 0 0 0 1px #d9d0b8;
    background-image:linear-gradient(180deg,rgba(0,0,0,.03),transparent 60px)}
  .doc-head{padding:16px 16px 13px;text-align:center;border-bottom:3px double #b9ad91;
    background:linear-gradient(180deg,#fffdf6,#f4edda)}
  .doc-org{font-size:13px;font-weight:800;color:#5c5340;letter-spacing:.06em}
  .doc-title{font-size:24px;font-weight:900;letter-spacing:.24em;margin:4px 0 5px;color:#211c10}
  .doc-sub{font-size:11.5px;color:#6b6250}
  .doc-no{font-size:11.5px;color:#6b6250;margin-top:3px}
  .doc-body{padding:6px 14px 12px}
  .doc-foot{padding:10px 14px 14px;font-size:11.5px;color:#6b6250;border-top:1px dashed #c9bfa6}
  .art{border-bottom:1px solid #ddd4bd;padding:9px 0 11px}
  .art:last-child{border-bottom:none}
  .art > h5{font-size:14.5px;font-weight:900;color:#2a2417;margin-bottom:6px;cursor:pointer;
    display:flex;align-items:center;gap:6px;letter-spacing:-.02em}
  .art > h5:before{content:"▾";font-size:11px;color:#8a7f66}
  .art.closed > h5:before{content:"▸"}
  .art.closed .art-c{display:none}
  .art .tg{font-size:10.5px;font-weight:900;background:#e7dcc0;color:#6b5b39;border-radius:99px;padding:1px 7px}
  .art-c{font-size:14px;line-height:1.72;color:#312a1b}
  .art-c p{margin:0 0 7px}
  .art-c .tiny{font-size:12.5px;color:#6b6250}
  .doct{width:100%;border-collapse:collapse;font-size:13.5px;margin:4px 0}
  .doct th,.doct td{border:1px solid #d3c9b1;padding:6px 9px;text-align:left;vertical-align:top}
  .doct th{background:#efe7d3;font-weight:800;white-space:nowrap;color:#3a3120}
  .doct td b{color:#1c170c}
  .doc .term{color:#8a4b00;border-bottom-color:#b9a06a}
  .doc .muted{color:#6b6250}
  .docwrap summary{cursor:pointer;font-weight:900;font-size:16px;color:#eaf3ff;list-style:none;
    display:flex;align-items:center;gap:8px;padding:2px 0}
  .docwrap summary::-webkit-details-marker{display:none}
  .docwrap summary .ico{font-size:15px}
  .docwrap summary .arrow{margin-left:auto;width:9px;height:9px;border-right:2.5px solid #8ba1c2;
    border-bottom:2.5px solid #8ba1c2;transform:rotate(45deg);transition:transform .2s}
  .docwrap[open] summary .arrow{transform:rotate(-135deg)}
  .doc-tools{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}

  /* ============================ 투찰 입력 ============================ */
  .money-in{position:relative;display:flex;align-items:center;margin-top:8px}
  .money-in input{width:100%;font-family:inherit;font-size:24px;font-weight:900;text-align:right;
    padding:11px 46px 11px 14px;border-radius:15px;letter-spacing:-.02em;
    background:#08101c;border:3px solid #3d5a86;color:#ffe08a;font-variant-numeric:tabular-nums;
    box-shadow:inset 0 3px 8px rgba(0,0,0,.7)}
  .money-in input:focus{outline:none;border-color:var(--gold);box-shadow:inset 0 3px 8px rgba(0,0,0,.7), 0 0 0 3px rgba(255,199,58,.25)}
  .money-in .unit{position:absolute;right:14px;font-weight:900;color:#93a7c6;font-size:15px}
  .gauge{height:11px;border-radius:99px;background:#08101c;overflow:hidden;margin-top:10px;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.8)}
  .gauge i{display:block;height:100%;border-radius:99px;transition:width .25s ease}
  .gauge i.mid{background:linear-gradient(90deg,#33d69a,#a9f3d4)}
  .gauge i.low{background:linear-gradient(90deg,#ff5b4d,#ffa79e)}
  .picks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
  .pn{cursor:pointer;font-family:inherit;font-size:16px;font-weight:900;color:#cfe0f8;aspect-ratio:1;
    border-radius:13px;background:linear-gradient(180deg,#23344f,#16243a);border:2px solid #33486c;
    box-shadow:0 4px 0 #070d18;display:grid;place-items:center;transition:transform .07s}
  .pn:active{transform:translateY(3px);box-shadow:0 1px 0 #070d18}
  .pn.on{background:linear-gradient(180deg,#ffe1a0,var(--gold2));border-color:#8a5a12;color:#3a2800;
    box-shadow:0 4px 0 #8a5a12}
  .pn:disabled{opacity:.35}
  .lockstep{opacity:.55;filter:grayscale(.4)}
  .checklist{list-style:none;margin:10px 0 0;padding:0}
  .checklist li{display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:12px;
    background:#0d1828;border:2px solid #24344f;margin-bottom:6px;cursor:pointer;font-size:14px;color:#c4d8f6}
  .checklist li .box{width:22px;height:22px;flex:none;border-radius:7px;border:2px solid #3d5a86;
    display:grid;place-items:center;font-size:13px;font-weight:900;color:#04231a}
  .checklist li.on{border-color:#1f8f68;background:rgba(51,214,154,.12);color:#a9f3d4}
  .checklist li.on .box{background:var(--mint);border-color:#0a6a4a}
  .wq{border:2px solid #24344f;border-radius:14px;padding:10px;margin-bottom:8px;background:#0d1828}
  .wq.right{border-color:#1f8f68;background:rgba(51,214,154,.08)}
  .wq.wrong{border-color:#9e261d;background:rgba(255,91,77,.08)}
  .wq .wt{display:flex;gap:8px;font-size:13.5px;font-weight:800;color:#eaf3ff;margin-bottom:7px}
  .wq .wn{flex:none;width:21px;height:21px;border-radius:50%;background:#22344f;border:1.5px solid #3d5a86;
    display:grid;place-items:center;font-size:11px;font-weight:900;color:#9fb2d0}
  .wq.right .wn{background:var(--mint);color:#04231a;border-color:#0a6a4a}
  .wq.wrong .wn{background:var(--red);color:#fff;border-color:#9e261d}
  .watch .opts{gap:6px}
  .watch .opt{font-size:13px;padding:7px 11px;min-height:42px}

  /* ============================ 개찰·결과 ============================ */
  .res-hero{position:relative;overflow:hidden;border-radius:20px;padding:18px 15px;text-align:center;
    border:3px solid #3d5a86;box-shadow:var(--sh);
    background:radial-gradient(400px 200px at 50% 0%,rgba(120,180,255,.22),transparent 70%),linear-gradient(180deg,#16263f,#0b1524)}
  .res-hero.win{border-color:var(--gold);
    background:radial-gradient(420px 220px at 50% 0%,rgba(255,199,58,.4),transparent 70%),linear-gradient(180deg,#2a2412,#100f0a)}
  .res-hero.lose{border-color:#7a2f27;
    background:radial-gradient(420px 220px at 50% 0%,rgba(255,91,77,.24),transparent 70%),linear-gradient(180deg,#2a1a1a,#100c0c)}
  .res-word{font-size:34px;font-weight:900;letter-spacing:-.05em;color:#fff;
    text-shadow:0 3px 0 rgba(0,0,0,.5), 0 0 30px rgba(255,199,58,.5);animation:stampIn .7s cubic-bezier(.3,1.4,.5,1) both}
  .res-hero.win .res-word{color:#ffdc7a}
  .res-hero.lose .res-word{color:#ffb2ab}
  .res-badge{width:56px;height:56px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;
    font-size:28px;font-weight:900;background:linear-gradient(180deg,#ffe1a0,var(--gold));color:#3a2800;
    box-shadow:0 5px 0 #8a5a12, 0 0 26px rgba(255,199,58,.6)}
  .stampbig{position:absolute;right:10px;top:10px;text-align:center;font-size:16px;font-weight:900;
    border:4px solid currentColor;border-radius:10px;padding:3px 10px;transform:rotate(-11deg);opacity:.95;
    letter-spacing:-.02em;line-height:1.1}
  .stampbig small{display:block;font-size:8.5px;letter-spacing:.1em;opacity:.9}
  .stampbig.fail{border-style:double}
  .rankbadge{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:7px;
    background:#22344f;color:#cfe0f8;font-size:12px;font-weight:900;border:1.5px solid #3d5a86}
  .rankbadge.one{background:linear-gradient(180deg,#ffe1a0,var(--gold));color:#3a2800;border-color:#8a5a12}
  .result-card{position:relative;border-radius:22px;padding:18px 16px;overflow:hidden;
    border:3px solid var(--gold);box-shadow:0 10px 0 #060c16, 0 0 40px -10px rgba(255,199,58,.5);
    background:radial-gradient(500px 260px at 50% -10%,rgba(255,199,58,.32),transparent 70%),linear-gradient(180deg,#22304b,#0d1726)}
  .result-card h2{font-size:26px;color:#fff;margin:6px 0 3px;letter-spacing:-.04em}
  .result-card .rc-top{display:flex;justify-content:space-between;font-size:11px;font-weight:900;
    color:#ffdc7a;letter-spacing:.1em}
  .result-card .rsub{font-size:12.5px;color:#a8bddb}
  .result-card .rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:13px 0}
  .result-card .rgrid > div{background:rgba(0,0,0,.35);border:2px solid #3d5a86;border-radius:13px;padding:8px 10px}
  .result-card .rgrid .k{font-size:11px;font-weight:900;color:#93a7c6}
  .result-card .rgrid .v{font-size:18px;font-weight:900;color:#ffdc7a;font-variant-numeric:tabular-nums}
  .result-card .rline{font-size:12.5px;color:#c4d8f6;border-top:1px dashed #3d5a86;padding-top:9px}
  .result-card .slogan{margin-top:9px;font-size:13.5px;font-weight:800;color:#fff;line-height:1.6}

  /* ============================ 게시판(공고 목록) ============================ */
  .boards{display:grid;gap:10px;margin-top:12px}
  .notice{position:relative;display:block;width:100%;text-align:left;cursor:pointer;font-family:inherit;
    border-radius:18px;padding:13px 14px 12px;color:#eaf3ff;
    background:linear-gradient(180deg,#1d2d49,#141f33);border:2.5px solid #33486c;
    box-shadow:0 6px 0 rgba(2,6,12,.55), inset 0 1px 0 rgba(255,255,255,.07);
    transition:transform .08s, box-shadow .08s, border-color .15s}
  .notice:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(2,6,12,.55)}
  .notice:before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:99px;
    background:var(--gold);box-shadow:0 0 12px rgba(255,199,58,.6)}
  .notice.locked{opacity:.72;filter:saturate(.6)}
  .notice.locked:before{background:#4a5a76;box-shadow:none}
  .notice .row1{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
  .notice .nm{font-size:16.5px;font-weight:900;letter-spacing:-.03em;line-height:1.35}
  .notice .meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:8px;font-size:12px;color:#a8bddb;align-items:center}
  .notice .meta b{color:#fff;font-weight:900}
  .dday{flex:none;font-size:12.5px;font-weight:900;background:linear-gradient(180deg,#ffe1a0,var(--gold));
    color:#3a2800;border-radius:10px;padding:3px 9px;box-shadow:0 2px 0 #8a5a12;white-space:nowrap}
  .dday.soon{background:linear-gradient(180deg,#ff9186,#e0392b);color:#fff;box-shadow:0 2px 0 #8e221a;
    animation:pulseSoft 1.6s ease-in-out infinite}
  @keyframes pulseSoft{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  /* ============================ 대시보드 ============================ */

  .mgr .ph2 img{width:100%;height:100%;object-fit:cover;object-position:50% 14%}

  .mgr .t2{font-size:11.5px;color:#8ba1c2}
  .mgr .tag{margin-left:auto}
  .ladder-wrap{margin-top:12px;border-radius:16px;background:#0b1524;border:2px solid #24344f;padding:11px}
  .ladder-head{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:#ffdc7a;margin-bottom:8px}
  .gauges{display:grid;gap:7px}
  .grow{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;font-size:11.5px}
  .gk{color:#8ba1c2;font-weight:900;white-space:nowrap}
  .gbar{height:9px;border-radius:99px;background:#0a1220;overflow:hidden;box-shadow:inset 0 1px 3px #000}
  .gbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#3d7bff,#9fc4ff)}
  .gbar i.gold{background:linear-gradient(90deg,#ffa51f,#ffe08a);box-shadow:0 0 10px rgba(255,199,58,.7)}
  .gbar i.blue{background:linear-gradient(90deg,#2f6ee0,#87b4ff)}
  .gv{color:#eaf3ff;font-weight:900;font-variant-numeric:tabular-nums}
  .ladder{display:grid;gap:6px}
  .lv{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:13px;background:#101d30;
    border:2px solid #24344f}

  .lv .no{width:28px;height:28px;flex:none;border-radius:9px;display:grid;place-items:center;

  .lv .bd{min-width:0;flex:1}
  .lv .nm{font-size:13.5px;font-weight:900;color:#eaf3ff;line-height:1.3}
  .lv .req{font-size:11px;color:#8ba1c2;display:flex;flex-wrap:wrap;gap:2px 8px}
  .lv .req .no{color:#ff9d92}
  .lv .go2{font-size:11px;font-weight:900;color:#8ff0c6;white-space:nowrap}
  .lv.lock .go2{color:#7a8caa}
  .prof{width:76px;height:76px;border-radius:18px;overflow:hidden;border:3px solid var(--gold);

  .prof img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
  .portrait{position:relative;overflow:hidden;background:linear-gradient(180deg,#ffe9b0,#e8d3a4)}

  .portrait.no-img:after{content:"사진 없음";position:absolute;inset:0;display:grid;place-items:center;

  /* ============================ 업종 선택(무대) ============================ */
  .cast{position:relative;margin-top:12px;border-radius:22px;padding:16px 10px 12px;overflow:hidden;
    border:3px solid #24395c;box-shadow:var(--sh);
    background:radial-gradient(600px 240px at 50% -20%,rgba(255,214,140,.28),transparent 66%),
      linear-gradient(180deg,#182741,#0a1320 70%,#070d18)}
  .cast:before{content:"";position:absolute;left:0;right:0;bottom:0;height:38%;
    background:linear-gradient(180deg,#152437,#0a1320);border-top:2px solid rgba(255,199,58,.18);
    clip-path:polygon(0 26%,50% 0,100% 26%,100% 100%,0 100%)}
  .cast-row{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;z-index:1}
  .actor{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;
    font-family:inherit;background:none;border:0;padding:6px 2px 4px;color:#eaf3ff;
    transition:transform .18s cubic-bezier(.2,1.4,.4,1), filter .18s;filter:saturate(.75) brightness(.85)}
  .actor .pad{position:absolute;left:50%;bottom:16px;width:74%;height:18px;transform:translateX(-50%);
    border-radius:50%;background:radial-gradient(ellipse,rgba(255,199,58,.55),transparent 70%);opacity:0;
    transition:opacity .2s}
  .actor .fig{position:relative;width:100%;aspect-ratio:3/4;max-height:180px;border-radius:16px 16px 10px 10px;
    overflow:hidden;border:3px solid #3d5a86;background:#f6f1e3;
    box-shadow:0 8px 16px rgba(0,0,0,.55);transition:border-color .2s, box-shadow .2s}
  .actor .fig img{width:100%;height:100%;object-fit:cover;object-position:50% 10%;display:block}
  .actor .nm{font-size:14px;font-weight:900;letter-spacing:-.02em;margin-top:2px;
    text-shadow:0 2px 6px #000;display:flex;align-items:center;gap:4px}
  .actor .dots{display:inline-flex;gap:2px}
  .actor .dots i{width:6px;height:6px;border-radius:50%;background:#3c4c68;display:block}
  .actor .dots i.f{background:var(--gold);box-shadow:0 0 6px rgba(255,199,58,.8)}
  .actor .diff{font-size:10.5px;font-weight:900;color:#a8bddb;letter-spacing:.02em}
  .actor:hover{filter:saturate(1) brightness(1)}
  .actor.on{transform:translateY(-8px) scale(1.04);filter:none}
  .actor.on .fig{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,199,58,.35), 0 14px 24px rgba(0,0,0,.6);
    animation:bob 2.6s ease-in-out infinite}
  .actor.on .pad{opacity:1}
  .actor.on .nm{color:#ffdc7a}
  .actor.on:after{content:"선택";position:absolute;top:-4px;right:2px;font-size:10px;font-weight:900;
    background:var(--gold);color:#3a2800;border-radius:99px;padding:1px 8px;box-shadow:0 2px 0 #8a5a12}
  .cast-hint{position:relative;z-index:1;text-align:center;font-size:12px;font-weight:900;color:#93a7c6;
    margin-top:8px;letter-spacing:.02em}

  /* ============================ 인트로(시네마) ============================ */
  .cine{position:relative;min-height:calc(100vh - 20px);display:flex;flex-direction:column;
    justify-content:center;padding:18px 4px 24px;overflow:hidden}
  /* 스플래시 */
  .splash{align-items:center;text-align:center;min-height:calc(100vh - 20px)}
  .splash .ray{position:absolute;left:50%;top:44%;width:120vmax;height:120vmax;transform:translate(-50%,-50%);
    background:conic-gradient(from 0deg,rgba(255,199,58,.16) 0 6deg,transparent 6deg 24deg);
    animation:spinSlow 42s linear infinite;pointer-events:none;opacity:.65}
  @keyframes spinSlow{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .splash .ring{position:absolute;left:50%;top:44%;width:min(84vw,420px);aspect-ratio:1;
    transform:translate(-50%,-50%);border-radius:50%;border:3px solid rgba(255,199,58,.28);
    box-shadow:0 0 60px rgba(255,199,58,.18) inset;pointer-events:none}
  .logo-box{position:relative;z-index:2}
  .logo-pre{font-size:12px;font-weight:900;color:#ffdc7a;letter-spacing:.42em;margin-bottom:10px;
    animation:fadeUp .7s .1s both}
  .logo-big{font-size:clamp(42px,14vw,84px);font-weight:900;line-height:1.04;letter-spacing:-.035em;
    color:#fff;text-shadow:0 4px 0 #8a5a12, 0 10px 0 rgba(0,0,0,.4), 0 0 48px rgba(255,199,58,.6);
    animation:logoIn .8s cubic-bezier(.2,1.5,.4,1) both}
  .logo-big .hl{background:linear-gradient(180deg,#fff6cf,#ffc73a 45%,#ff9d1b 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 0 rgba(138,90,18,.9));display:inline-block;margin-left:.14em}
  .logo-en{font-size:clamp(11px,3.4vw,15px);font-weight:900;letter-spacing:.62em;color:#9fb2d0;margin-top:8px;
    animation:fadeUp .7s .35s both}
  .logo-load{width:min(56vw,220px);height:10px;border-radius:99px;background:rgba(0,0,0,.6);margin:22px auto 0;
    overflow:hidden;box-shadow:inset 0 2px 4px #000;animation:fadeUp .6s .5s both}
  .logo-load i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#ffa51f,#ffe08a);box-shadow:0 0 14px rgba(255,199,58,.9);
    animation:loadBar 2.5s cubic-bezier(.3,.7,.3,1) .35s forwards}
  @keyframes loadBar{to{width:100%}}
  .tap-hint{margin-top:16px;font-size:12px;font-weight:900;color:#9fb2d0;letter-spacing:.1em;
    animation:blink 1.5s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes logoIn{0%{transform:translateY(26px) scale(.86) rotate(-2deg);opacity:0}
    60%{transform:translateY(-5px) scale(1.03) rotate(0)}
    100%{transform:none;opacity:1}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  /* 떠다니는 그림들 */
  .floaty{position:absolute;z-index:1;opacity:0;animation:floatIn 1.1s cubic-bezier(.2,1.4,.4,1) forwards,
    floatY 5s ease-in-out infinite alternate;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
  @keyframes floatIn{from{opacity:0;transform:translateY(24px) scale(.6) rotate(-12deg)}
    to{opacity:1;transform:none}}
  @keyframes floatY{from{translate:0 -7px}to{translate:0 7px}}
  .floaty svg{display:block}
  .f1{left:6%;top:11%;animation-delay:.15s,.15s;width:56px}
  .f2{right:7%;top:14%;animation-delay:.3s,.3s;width:48px}

  .f4{right:9%;bottom:19%;animation-delay:.55s,.55s;width:54px}

  .f6{right:32%;bottom:6%;animation-delay:.8s,.8s;width:44px}

  /* 스토리 */
  .story{justify-content:flex-end;gap:0}

  .story-set .night{position:absolute;inset:0;

      radial-gradient(1.5px 1.5px at 82% 34%,#fff,transparent);opacity:.7}
  .story-set .desk{position:absolute;left:0;right:0;bottom:0;height:24%;z-index:1;

  .story-set .bust svg{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 20px rgba(0,0,0,.6))}
  .story-set .bubblebox{position:absolute;left:10px;right:10px;top:10px;z-index:3}
  .sbubble{position:relative;background:#fdf8ea;color:#241d10;border-radius:16px;padding:11px 13px;
    font-size:15px;font-weight:800;line-height:1.55;box-shadow:0 6px 0 rgba(0,0,0,.35);
    animation:popIn .3s cubic-bezier(.2,1.4,.4,1) both}

  .sbubble.right:after{background:#eaf2ff;left:auto;right:26px}
  .sname{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:900;color:#3a2800;
    background:var(--gold);border-radius:99px;padding:2px 9px;margin-bottom:6px;box-shadow:0 2px 0 #8a5a12}
  .sname.f{background:#9fc4ff;box-shadow:0 2px 0 #3a72c8}
  /* 브라우저 연출 */
  .browser{position:absolute;left:12px;right:12px;top:8px;bottom:12px;z-index:4;border-radius:14px;overflow:hidden;
    background:#0d1626;border:2px solid #3d5a86;box-shadow:0 12px 30px rgba(0,0,0,.6);
    display:flex;flex-direction:column;animation:popIn .4s cubic-bezier(.2,1.3,.4,1) both}
  .browser.inline{position:relative;left:auto;right:auto;top:auto;bottom:auto;min-height:300px;margin:0}

  .browser .url{flex:1;background:#08101c;border-radius:8px;padding:3px 9px;font-size:11px;color:#a8bddb;

  .browser .body2{flex:1;padding:10px;overflow:hidden;background:#f7f9fc;color:#1c2536}
  .browser .search{display:flex;align-items:center;gap:6px;border:2px solid #4a8cff;border-radius:99px;

  .browser .search .q{flex:1;white-space:nowrap;overflow:hidden}
  .browser .search .q b{color:#0b57d0}

  .browser .rr{background:#fff;border:1px solid #dfe6f2;border-radius:9px;padding:7px 9px;

const WD = ["일", "월", "화", "수", "목", "금", "토"];
const p2 = n => String(n).padStart(2, "0");
const won = n => Math.round(n).toLocaleString("ko-KR");
const wonP = n => Number(n).toLocaleString("ko-KR", { maximumFractionDigits: 2 });
const eok = n => {
  const v = Math.round(n);
  const s = v < 0 ? "-" : "";
  const a = Math.abs(v);
  if (a >= 100000000) {
    const e = Math.floor(a / 100000000), m = Math.round((a % 100000000) / 10000);
    return s + e + "억" + (m ? " " + m.toLocaleString("ko-KR") + "만" : "") + "원";
  }
  if (a >= 10000) return s + Math.round(a / 10000).toLocaleString("ko-KR") + "만원";
  return s + won(a) + "원";
};
const pct = (r, d = 2) => (r * 100).toFixed(d) + "%";
/* 추정가격은 부가가치세를 뺀 금액 (국가계약법 시행령 §9②) — 기초금액은 부가세를 더한 금액 */
const vatExcluded = n => Math.floor(n / 1.1);
const dISO = ms => { const d = new Date(ms); return d.getUTCFullYear() + "-" + p2(d.getUTCMonth() + 1) + "-" + p2(d.getUTCDate()); };
const fDate = ms => { const d = new Date(ms); return d.getUTCFullYear() + ". " + p2(d.getUTCMonth() + 1) + ". " + p2(d.getUTCDate()) + ". (" + WD[d.getUTCDay()] + ")"; };
const fDT = ms => { const d = new Date(ms); return fDate(ms) + " " + p2(d.getUTCHours()) + ":" + p2(d.getUTCMinutes()); };
const fTime = ms => p2(new Date(ms).getUTCHours()) + ":" + p2(new Date(ms).getUTCMinutes());
const addDays = (ms, d) => ms + d * 86400000;
const diffDays = (a, b) => Math.round((b - a) / 86400000);
const isBn = ms => { const w = new Date(ms).getUTCDay(); return w === 0 || w === 6 || HOLIDAYS.has(dISO(ms)); };
function addBizDays(ms, n) {
  let t = ms, c = 0, guard = 0;
  while (c < n && guard++ < 400) { t = addDays(t, 1); if (!isBn(t)) c++; }
  return t;
}
/* 주말·공휴일이면 다음 영업일 같은 시각으로 */
function nextBiz(ms) {
  let t = ms, guard = 0;
  while (isBn(t) && guard++ < 30) t = addDays(t, 1);
  return t;
}
/* a 다음날부터 b(마감일)까지 남은 영업일 수 — 토·일·공휴일은 세지 않는다 */
function bizDaysLeft(a, b) {
  let c = 0, t = a, guard = 0;
  while (t < b && guard++ < 400) { t = addDays(t, 1); if (t <= b && !isBn(t)) c++; }
  return c;
}
/* 주말·공휴일이면 그 앞 영업일로 — ‘14일 이내’ 같은 기한을 넘기지 않게 */
function prevBiz(ms) {
  let t = ms, guard = 0;
  while (isBn(t) && guard++ < 30) t = addDays(t, -1);
  return t;
}
/* 날짜만 보고 세는 D-day — 03.03 09:00 에서 03.06 마감이면 D-3 */
const dayKey = ms => { const d = new Date(ms); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); };
const dDay = (from, to) => Math.max(0, Math.round((dayKey(to) - dayKey(from)) / 86400000));
/* 받침에 따라 ‘로 / 으로’ */
function josaRo(word) {
  const s = String(word || "").trim();
  if (!s) return "로";
  const code = s.charCodeAt(s.length - 1);
  if (code < 0xac00 || code > 0xd7a3) return "로";
  const jong = (code - 0xac00) % 28;
  return (jong === 0 || jong === 8) ? "로" : "으로";
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rnd = (a, b) => a + Math.random() * (b - a);
const int = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];

const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };

  const f = NAME_PARTS.field[charId];

  for (let i = 0; i < 80; i++) {

  return pick(NAME_PARTS.region) + pick(f) + int(2, 9);

function validateName(raw) {
  const v = String(raw || "");

  return { ok: true, msg: "사용할 수 있는 이름입니다." };
}

/* 공고마다 마감까지 남은 날과 시각이 하나로 고정되어 있다 —
   판이 바뀌어 목록 순서가 돌아도 같은 공고의 마감은 같은 규칙을 따른다. */
const CLOSE_PLAN = [
  { d: 3, h: 11, m: 0 },
  { d: 4, h: 14, m: 0 },
  { d: 6, h: 10, m: 0 },
  { d: 5, h: 16, m: 0 }
];
function buildNotices() {
  const all = NOTICES[S.charId];
  const cut = (S.rounds % 2 === 0) ? 0 : 1;
  const rot = all.slice(cut).concat(all.slice(0, cut));
  const three = (S.mode === "quick" ? rot.slice(0, 2) : rot.slice(0, 3));
  const d = new Date(S.now);
  const mid = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 0, 0);
  S.notices = three.map(n => {
    const idx = all.findIndex(x => x.id === n.id);
    const plan = CLOSE_PLAN[idx % CLOSE_PLAN.length];
    const raw = mid + plan.d * 86400000 + plan.h * 3600000 + plan.m * 60000;
    return { nid: n.id, close: nextBiz(raw) };
  });
  S.noticeId = null;
  S.bid = null;
  S.watch = null;
  S.readOk = false;
}
const noticeDef = nid => NOTICES[S.charId].find(n => n.id === nid);
function noticeOf() {
  const it = S.notices.find(n => n.nid === S.noticeId);
  if (!it) return null;
  return Object.assign({}, noticeDef(it.nid), { close: it.close, nid: it.nid });
}

function makeRivals(n) {
  const c = CH(), cnt = int(c.rivals[0], c.rivals[1]), out = [];
  const used = new Set([S.company]);
  for (let i = 0; i < cnt; i++) {
    let nm = rivalName(S.charId), g = 0;
    while (used.has(nm) && g++ < 50) nm = rivalName(S.charId);
    used.add(nm);
    const r = rivalFloor(n) + Math.random() * RULES.rivalSpread;
    out.push({ name: nm, amount: Math.round(n.base * r / 1000) * 1000 });
  }
  return out;
}
/* 경쟁자의 최저 투찰률 — 예정가격이 최대 +2%까지 올라가도 하한 아래로 떨어지지 않는 선 */
function rivalFloor(n) { return n.lb * 1.02 + 0.008; }
function safeBand(n) {
  return { low: Math.ceil(n.base * (n.lb * 1.02 + 0.002) / 1000) * 1000,
           high: Math.floor(n.base * (n.lb * 1.02 + 0.007) / 1000) * 1000 };
}
function drawYejeong(n) {
  const prices = [];
  for (let i = 0; i < 15; i++) prices.push(Math.round(n.base * (1 + rnd(-0.02, 0.02)) / 1000) * 1000);
  const picks = S.bid.picks.slice();
  S.rivals.forEach(() => { picks.push(int(1, 15)); picks.push(int(1, 15)); });
  const cnt = {};
  picks.forEach(p => cnt[p] = (cnt[p] || 0) + 1);
  const order = Object.keys(cnt).map(Number).sort((a, b) => (cnt[b] - cnt[a]) || (a - b));
  const top = order.slice(0, 4), filled = top.slice();
  let g = 0;
  while (filled.length < 4 && g++ < 30) filled.push(int(1, 15));
  const list = filled.map(k => prices[k - 1]);
  const avg = list.reduce((s, v) => s + v, 0) / list.length;
  return { prices, picks, counts: cnt, top: filled, list, avg, yejeong: Math.ceil(avg) };
}
function priceScore(amount, yejeong) {
  const r = amount / yejeong * 100;
  return Math.max(0, Math.round((70 - 2 * Math.abs(90 - r)) * 100) / 100);
}
function lateFee(amount, rate, days) {
  const raw = Math.round(amount * rate * days), cap = Math.round(amount * RULES.lateCapRate);
  return { raw, cap, fee: Math.min(raw, cap), capped: raw > cap };
}

/* =====================================================================
   [16] 조건 5개 찾기
   ===================================================================== */
function buildWatch(n) {
  const c = CH();
  const items = [];
  let right, wrongs;
  if (n.need.ownProd) { right = "직접생산확인증명서를 보유한 자"; wrongs = ["실적 3억원 이상인 자", "건설업 등록을 한 자"]; }
  else if (n.need.license) { right = "건설업 등록을 하고 시공능력을 갖춘 자"; wrongs = ["실적 5천만원 이상인 자", "직접생산확인증명서를 보유한 자"]; }
  else if (n.need.perf) { right = "최근 3년 실적 " + eok(n.need.perf) + " 이상인 자"; wrongs = ["직접생산확인증명서를 보유한 자", "건설업 등록을 한 자"]; }
  else { right = "자본금 " + eok(n.need.capital) + " 이상인 자"; wrongs = ["실적 1억원 이상인 자", "건설업 등록을 한 자"]; }
  items.push({ n: 1, q: "참가자격 — 이 공고가 추가로 요구하는 것은?", right, opts: shuffle([right].concat(wrongs)) });
  items.push({ n: 2, q: "입찰보증금 — 어떻게 내야 합니까?", right: "지급각서를 제출하면 면제된다", opts: shuffle(["지급각서를 제출하면 면제된다", "현금 5%만 인정된다", "보증금은 없다"]) });
  items.push({ n: 3, q: "마감 — 언제까지, 무엇을 기준으로?", right: fDT(n.close) + " · 서버에 도착한 시각", opts: shuffle([fDT(n.close) + " · 서버에 도착한 시각", fDT(n.close) + " · 내 컴퓨터 시각", fDate(n.close) + " 18:00 · 서버 시각"]) });
  items.push({ n: 4, q: "적격심사 — 통과점수는?", right: c.qualScore + "점 이상", opts: shuffle([c.qualScore + "점 이상", "70점 이상", "가장 낮은 가격이면 무조건 낙찰"]) });
  items.push({ n: 5, q: "납기 — 언제까지 넘겨야 합니까?", right: "계약일부터 " + n.deliverDays + "일", opts: shuffle(["계약일부터 " + n.deliverDays + "일", "계약일부터 " + (n.deliverDays + 30) + "일", "납기 제한 없음"]) });
  return { items, ans: {} };
}
function watchDone() {
  if (!S.watch) return false;
  return S.watch.items.every(it => S.watch.ans[it.n] === it.right);
}
function watchScore() {
  if (!S.watch) return 0;
  return S.watch.items.filter(it => S.watch.ans[it.n] === it.right).length;
}

function runScenes(root) {

    const target = parseFloat(el.dataset.target || "0.35");

    const caps = SCENE_CAPS[el.dataset.scene] || [];

    el.style.setProperty("--p", "0");
    setCap(0);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.setProperty("--p", String(target));
      setCap(target);
    }));
  });

/* 자본 숫자를 굴려 올린다 */
function countUp(el, to, fmt) {
  if (!el) return;
  const from = window.__capAnimFrom;
  window.__capAnimFrom = to;
  if (from === undefined || from === to) { el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 700;
  (function step(t) {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(Math.round(from + (to - from) * e));
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
function afterRender() {

  if (GATE && BEAT === 0) {
    const PH = ["공고문을 펼치는 중…", "예비가격 번호를 뽑는 중…", "개찰표를 기다리는 중…", "낙찰가를 굴리는 중…"];
    let pi = 0;
    window.__phI = setInterval(() => { const t = document.querySelector(".tap-hint"); if (t) { pi = (pi + 1) % PH.length; t.textContent = PH[pi]; } }, 900);
    window.__splashT = setTimeout(() => { if (GATE && BEAT === 0) { BEAT = 1; render(); } }, 2700);
  }
  /* 지금 화면에 새 용어가 있으면 풀이 상자를 연다 (모바일에서는 3초 뒤 자동으로 닫힌다) */
  document.querySelectorAll(".term:not(.seen)").forEach(t => t.classList.add("new"));
  const key = sc_key();
  const autoOK = ["detail", "qual", "contract"].indexOf(S.screen) >= 0 && !GATE;
  if (autoOK && !document.getElementById("termbox") && window.__termKey !== key) {
    const first = document.querySelector(".term.new");
    if (first) { window.__termKey = key; setTimeout(() => { if (!document.getElementById("termbox")) showTerm(first.dataset.term); }, isMob ? 1100 : 600); }
  }
  /* 자본금이 바뀌면 숫자가 튀어 오르고 +/− 금액이 떠오른다 · 자본이 바뀌면 상단 금고가 반짝인다 */
  const capEl = document.getElementById("capVal");
  if (capEl) countUp(capEl, S.capital, eok);
  const prev = window.__capSeen;
  if (prev !== undefined && prev !== S.capital) {
    const diff = S.capital - prev;
    const hud = document.getElementById("hudCapital");
    if (hud) countUp(hud, S.capital, eok);
    const box = document.getElementById("capStat");
    if (box) {
      const d = document.createElement("span");
      d.className = "delta" + (diff < 0 ? " down" : "");
      d.textContent = (diff > 0 ? "+" : "\u2212") + eok(Math.abs(diff));
      box.appendChild(d);
    }
    const vb = document.querySelector(".vaultbox");
    if (vb) { vb.classList.remove("bump"); void vb.offsetWidth; vb.classList.add("bump"); }
    const mh = document.getElementById("moneyHero");
    if (mh) { mh.classList.remove("bump"); void mh.offsetWidth; mh.classList.add("bump"); }
    if (diff !== 0) {
      const host = vb || mh;
      if (host) {
        const s = document.createElement("span");
        s.className = "coinfly"; s.textContent = (diff > 0 ? "+" : "\u2212") + eok(Math.abs(diff));
        host.appendChild(s);
        setTimeout(() => s.remove(), 1800);
      }
    }
  }
  window.__capSeen = S.capital;
  /* 단계 트랙의 현재 노드를 가운데로 */
  const nowStep = document.querySelector(".snodes .now");
  if (nowStep) {
    const wrap = nowStep.parentNode;
    if (wrap && wrap.scrollTo) wrap.scrollTo({ left: Math.max(0, nowStep.offsetLeft - wrap.clientWidth / 2 + nowStep.clientWidth / 2), behavior: "smooth" });
  }
  if (S.screen === "name" && !GATE) bindNameInput();
  if (S.screen === "bid" && !GATE) bindBidInput();
  aimArrow();
  /* 개찰 연출 — 판마다 한 번 */
  if (!GATE && S.screen === "open" && S.result) {
    const rk = "r" + S.result.yej + "|" + S.result.mine.amount + "|" + (S.result.outcome || "");
    if (window.__revealKey !== rk) { window.__revealKey = rk; showReveal(); }
  }
}

function burst() {
  const cx = window.innerWidth / 2, cy = window.innerHeight * 0.34;
  for (let i = 0; i < 16; i++) {
    const s = document.createElement("i");
    s.className = "spark";
    const a = (Math.PI * 2 * i) / 16, r = 90 + Math.random() * 90;
    s.style.left = cx + "px"; s.style.top = cy + "px";
    s.style.setProperty("--dx", Math.cos(a) * r + "px");

    s.style.background = i % 3 === 0 ? "#fff6cf" : (i % 3 === 1 ? "#ffc73a" : "#33d69a");

function portraitMarkup(c, cls) {
  const src = PORTRAITS[c.id] || "";
  if (!src) return '<div class="ph"><div class="t">' + c.name + " \u00b7 " + c.who + "</div></div>";
  return '<img class="' + (cls || "") + '" src="' + src + '" alt="' + c.shop + " " + c.owner + '"' +
    ' onerror="this.closest(&quot;.portrait&quot;).classList.add(&quot;no-img&quot;)" loading="lazy">';
}
function recommendSector() {
  if (S.quiz.some(v => !v)) return null;
  const cnt = { goods: 0, service: 0, works: 0 };
  S.quiz.forEach(v => cnt[v]++);
  return Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
}

function bindNameInput() {
  const inp = document.getElementById("nameInput");
  if (!inp) return;
  inp.addEventListener("input", () => {
    S.typedName = inp.value;
    const v = validateName(inp.value), h = document.getElementById("nameHint");
    if (!h) return;
    h.textContent = v.msg;
    h.style.color = v.ok ? "var(--green)" : (inp.value.length ? "var(--red)" : "var(--muted)");
  });
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { const b = document.querySelector('[data-act="useManual"]'); if (b) b.click(); } });
}

function nextTodo() {
  if (S.phase === "list") {
    const open = S.notices.filter(n => { const d = noticeDef(n.nid); return d && eligible(d) && n.close > S.now; });
    if (!open.length) return "지금은 참가할 수 있는 공고가 없습니다. 조건을 갖추거나 다음 공고를 기다리십시오.";
    return "공고를 골라 참가 신청을 하십시오. 참가할 수 있는 공고가 " + open.length + "건 있습니다.";
  }
  return "진행 중인 입찰을 마무리하십시오.";
}
function screenDashboard() {
  const c = CH();

  const certBox = canCert
    ? '<div class="good" style="margin-top:11px">낙찰 실적이 생겼습니다. ' + T("ownProd", "직접생산확인") +
      "을 신청할 수 있습니다. (소상공인·소기업 첫 신청 무료, 처리 7일 — " + GS +
      ')<div class="btn-row" style="margin-top:9px"><button class="btn sm" data-act="applyCert">직접생산확인 신청하기</button></div></div>'
    : "";
  const ns = (S.notices || []).map(x => noticeDef(x.nid)).filter(Boolean);
  const maxBase = ns.length ? Math.max.apply(null, ns.map(x => x.base)) : 0;
  const maxPerf = ns.length ? Math.max.apply(null, ns.map(x => (x.need && x.need.perf) || 0)) : 0;
  const cl = (v, max, min) => (max > 0 ? Math.max(min, Math.min(100, Math.round(v / max * 100))) : 0);
  const g = (k, v, p, cls) => '<div class="grow"><span class="gk">' + k + '</span>' +
    '<div class="gbar"><i class="' + cls + '" style="width:' + p + '%"></i></div>' +
    '<span class="gv">' + v + "</span></div>";
  const ladder = ns.slice().sort((a, b) => a.base - b.base).map((x, i) => {
    const rows = eligibility(x), open = rows.every(r => r.ok);

      '<div class="req">' + (rows.length
        ? rows.map(r => '<span class="' + (r.ok ? "" : "no") + '">' + (r.ok ? "\u2713 " : "\u2715 ") + r.label + "</span>").join("")
        : "<span>자격 조건 없음</span>") + "</div></div>" +
      '<span class="go2">' + (open ? "도전 가능" : "\uD83D\uDD12 자격 미달") + "</span></div>";
  }).join("");

  const body =
    stepsHTML(1) +
    objbar("<b>다음 할 일</b> · " + nextTodo()) +
    '<div class="vaultbox" id="capStat" style="margin-top:12px"><span class="vcoin">\u20A9</span>' +
      '<div class="vv"><div class="vk">자본금 · 내 금고</div>' +
        '<div class="vnum" id="capVal">' + eok(S.capital) + "</div></div>" +
      '<div class="hchip" style="flex-direction:column;align-items:flex-end;gap:2px">' +
        '<div class="hk">낙찰</div><div class="hv">' + S.wins + "건</div></div></div>" +
    '<div class="mgr"><div class="ph2">' + portraitMarkup(c) + "</div>" +
      '<div><div class="t1">' + esc(S.company) + " · 사무소 · 직원 " + S.staff + "명</div>" +
      '<div class="t2">' + c.owner + " · " + c.name + " · " + fDate(S.now) + "</div></div>" +
      '<span class="tag">' + c.diffLabel + "</span></div>" +
    '<div class="card">' +
      '<div class="statgrid">' +
        '<div class="stat"><div class="k">최근 3년 실적</div><div class="v">' + (S.perf ? eok(S.perf) : "없음") + "</div></div>" +
        '<div class="stat"><div class="k">신용등급</div><div class="v">' + S.credit + "</div></div>" +
        '<div class="stat"><div class="k">낙찰</div><div class="v">' + S.wins + "건 <small>/ " + Math.min(S.rounds, ROUNDS()) + "회 도전</small></div></div>" +
        '<div class="stat"><div class="k">남은 기회</div><div class="v">' + heartsRow() + "</div></div>" +
      "</div>" +
      '<div class="ladder-wrap">' +
        '<div class="ladder-head"><span class="ico">\u25B2</span>성장 게이지 · 자본 · 실적 · 도전</div>' +
        '<div class="gauges">' +
          g("자본금", eok(S.capital), cl(S.capital, maxBase, 4), "gold") +
          g("실적", (S.perf ? eok(S.perf) : "없음"), cl(S.perf, maxPerf, 4), "") +
          g("도전", Math.min(S.rounds + 1, ROUNDS()) + " / " + ROUNDS(), cl(S.rounds, Math.max(1, ROUNDS()), 5), "blue") +

        '<div class="ladder">' + ladder + "</div>" +

      (S.sanctioned.length ? '<div class="bad" style="margin-top:11px">제재 이력 · ' + S.sanctioned.join(" / ") + "</div>" : "") +

      ["나라장터의 ‘나의 입찰’ 화면과 같습니다. 진행 중인 건, 마감된 건, 낙찰·탈락 결과가 모입니다.",

    const d = noticeDef(n.nid);
    if (!d) return "";
    const okAll = eligible(d);
    const left = n.close - S.now;
    const dd = dDay(S.now, n.close);           // 날짜끼리 비교 — 시각 때문에 하루가 더 세지지 않는다

      '<div class="row1"><div><div class="nm">' + d.name + (d.flagship ? ' <span class="tag blue">공고문 전문</span>' : "") + "</div>" +
      '<div class="tiny muted" style="margin-top:3px">' + d.org + " · " + d.demand + "</div></div>" +
      (closed ? '<span class="dday soon">마감</span>' : '<span class="dday ' + (dd <= 1 ? "soon" : "") + '">' + (dd === 0 ? "오늘 마감" : "D-" + dd) + "</span>") +
      "</div>" +
      '<div class="meta"><span>기초금액 <b>' + won(d.base) + "원</b></span>" +
        "<span>마감 <b>" + fDT(n.close) + "</b></span>" +
        (okAll ? '<span class="tag green">참가 가능</span>' : '<span class="tag red">\uD83D\uDD12 참가자격 미달</span>') +
      "</div></button>";
  }).join("");

  const body =

/* 입력한 금액의 비율·판정 — 값이 바뀔 때마다 다시 그린다 */
function bidJudgeHTML(n, amt) {
  amt = Math.floor(amt || 0);
  if (!n || !amt) return "";
  const cap = Math.floor(n.base * RULES.capRate), lbAmt = Math.ceil(n.base * n.lb);
  const rate = amt / n.base * 100;
  const bad = amt < lbAmt || amt >= cap;
  /* 하한·상한에 바짝 붙었을 때는 퍼센트 대신 몇 원 차이인지 적는다 */
  const dLb = amt - lbAmt, dCap = cap - amt;
  let edge = "";
  if (Math.abs(dLb) <= 1000) edge = " · 낙찰하한 " + won(lbAmt) + "원" + (dLb === 0 ? "과 같은 금액" : dLb > 0 ? "보다 " + won(dLb) + "원 위" : "보다 " + won(-dLb) + "원 아래");
  else if (Math.abs(dCap) <= 1000) edge = " · 102% 상한 " + won(cap) + "원" + (dCap > 0 ? "보다 " + won(dCap) + "원 아래" : "과 같은 금액 (접수 안 됨)");
  return '<div class="gauge"><i class="' + (bad ? "low" : "mid") + '" style="width:' + Math.min(100, Math.max(0, rate - 60) / 45 * 100) + '%"></i></div>' +
    '<div class="tiny" style="margin-top:6px;color:' + (bad ? "var(--red)" : "var(--green)") + '">' +
    "기초금액의 " + rate.toFixed(3) + "% (" + won(amt) + "원" + edge + ") · " +
    (amt < lbAmt ? "낙찰하한 아래 — 1순위여도 심사 대상이 아닙니다" : amt >= cap ? "102% 상한 초과 — 접수되지 않습니다 (게임 설정)" : "제출 가능한 구간입니다") + "</div>";
}
function bindBidInput() {
  const inp = document.getElementById("bidAmount");

  const apply = () => {
    const digits = inp.value.replace(/[^0-9]/g, "");
    const v = digits ? parseInt(digits, 10) : 0;
    S.bid.amount = v;
    const pretty = digits ? won(v) : "";
    if (inp.value !== pretty) inp.value = pretty;
    const wrap = document.getElementById("bidJudgeWrap");
    if (wrap) {
      wrap.innerHTML = bidJudgeHTML(noticeOf(), v);
      wrap.style.display = v ? "" : "none";
    }
  };
  inp.addEventListener("input", apply);
  inp.addEventListener("change", apply);
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { const b = document.querySelector('[data-act="submitBid"]'); if (b) b.click(); } });

function finishBid() {
  const n = noticeOf();
  const yej = S.draw.yejeong;
  const rows = [{ name: S.company, amount: S.bid.amount, mine: true }].concat(S.rivals);
  rows.sort((a, b) => a.amount - b.amount);
  rows.forEach(r => {
    r.rate = r.amount / yej;
    r.over = r.amount > yej;
    r.lbFail = r.rate < n.lb;
    r.valid = !r.over;
    r.invalid = false;
  });
  const mine = rows.find(r => r.mine);
  /* 산출내역서 미제출 → 무효 (공고문 10항, 시행규칙 §44) */
  if (S.careless) { mine.invalid = true; mine.valid = false; }
  let rk = 0;
  rows.forEach(r => { if (r.valid) r.rank = ++rk; });
  const qualified = rows.filter(r => r.valid && !r.lbFail);
  qualified.forEach((r, i) => r.qualRank = i + 1);

  let outcome;
  if (!rows.some(r => r.valid)) outcome = "유찰";
  else if (mine.invalid) outcome = "무효";
  else if (!mine.valid) outcome = "초과";
  else if (mine.lbFail) outcome = "하한미달";
  else if (qualified.length && qualified[0].mine) outcome = "1순위";
  else outcome = "탈락";

  const second = qualified.find(r => !r.mine);
  S.result = { yej, rows, mine, outcome, second, lb: n.lb, careless: !!S.careless, notifiedAt: S.now };
  S.phase = "open";
}
