        '<div class="tiny muted" style="margin-top:6px">※ 서류 5종 구성은 게임에서 단순화했습니다 (' + GS + ").</div>" +
        '<div class="btn-row">' +
          '<button class="btn" data-act="submitQual">서류 제출하기' + (missing ? " (" + missing + "개 빠짐)" : "") + "</button>" +
          '<button class="btn subtle" data-act="delayQual">하루 미루기</button>' +
        "</div>" +
      "</div>";
  } else if (q.phase === "result") {
    const pass = !q.failed && q.score >= c.qualScore;
    let headline = pass ? "적격 — 통과했습니다."
      : q.failed === "late" ? "서류를 내지 않아 차순위로 넘어갑니다."
      : q.failed === "docs" ? "보완 기한 안에 서류를 채우지 못했습니다."
      : "부적격 — " + c.qualScore + "점에 " + (c.qualScore - q.score).toFixed(2) + "점 모자랍니다.";
    const sub = pass ? "이제 낙찰자로 확정됩니다. 다음은 계약입니다."
      : q.failed ? "정당한 사유 없이 계약을 체결하지 않은 것으로 보아 <b>6개월 입찰참가자격 제한</b>이 남습니다. (시행규칙 별표2 제13호 가목)"
      : "부적격 통보를 받으면 <b>3일 안에</b> 재심사를 요청할 수 있습니다. 다만 <b>새 서류를 덧붙일 수는 없습니다.</b>";
    core =
      '<div class="card"><div class="card-title"><span class="ico">2</span>심사 결과</div>' +
        '<div class="' + (pass ? "good" : "bad") + '"><b>' + headline + "</b> " + sub + "</div>" +
        (!q.failed ? '<div class="calc" style="margin-top:12px">입찰가격 평점 = 70 − 2 × |90 − (내 투찰가 ÷ 예정가격 × 100)|\n' +
          "            = 70 − 2 × |90 − " + (R.mine.rate * 100).toFixed(2) + "|\n" +
          "            = " + q.pricePart.toFixed(2) + "점\n" +
          "비가격 평점 (실적·신용·경영상태) = " + RULES.nonPriceScore.toFixed(2) + "점 (" + GS + ")\n" +
          "합계 = " + q.score.toFixed(2) + "점 / 통과점수 " + c.qualScore + "점</div>" : "") +
        '<p class="tiny muted" style="margin-top:8px">근거 · ' + c.qualBasis + ". 비가격 배점은 게임에서 30점 만점으로 단순화했습니다.</p>" +
        (pass ? '<div class="tiny muted" style="margin-top:8px">낙찰자 결정 통지 · <b>' + fDT(R.awardedAt || S.now) + '</b> — 계약은 이 통지를 받은 날부터 10일 이내입니다.</div>' : "") +
        '<div class="btn-row">' +
          (pass ? '<button class="btn" data-act="toContract">계약하러 가기</button>'
                : (q.failed ? '<button class="btn" data-act="giveUpQual">다음 공고로</button>'
                            : '<button class="btn ghost" data-act="reexam">재심사 요청 (3일)</button>' +
                              '<button class="btn subtle" data-act="giveUpQual">포기하고 다음 공고</button>')) +
        "</div>" +
      "</div>";
  }
  const body =
    stepsHTML(5) +
    objbar("<b>적격심사</b> · " + (q.phase === "result" ? "심사 결과" : "서류를 5일 안에 내십시오")) +
    '<div class="card tight" style="background:#fbfdff;margin-top:12px"><div class="tiny muted">적격심사 대상자 통보</div>' +
      '<div style="font-weight:700;font-size:16px;margin:3px 0">' + esc(S.company) + " 귀하</div>" +
      '<div class="tiny">「' + n.name + '」에 대하여 <b>적격심사 대상자</b>로 선정되었음을 통보합니다. 이것은 낙찰 확정이 아니라 심사 대상 통보입니다. 심사를 통과해야 낙찰자로 확정됩니다.<br>심사 대상 금액(내 투찰가)은 <b>' + won(R.mine.amount) + "원</b>입니다.</div>" +
      '<div class="tiny muted" style="margin-top:5px">' + n.org + " · " + fDT(q.notifiedAt || S.now) + '</div><div class="seal" style="position:absolute"></div></div>' +
    core +
    guide("적격심사에서 실제로 많이 틀립니다",
      ["자기평가 및 심사표를 잘못 써서 점수가 깎입니다. 실적증명서를 미리 발급받아 두어야 합니다.",
       "서류를 안 내고 버티면 차순위로 넘어가고, 6개월 입찰 제한을 받을 수 있습니다.",
       "재심사는 ‘다시 계산해 달라’는 것이지, 새 서류를 붙이는 자리가 아닙니다."],
      "qual");
  return chrome(body);
}

/* =====================================================================
   [29] 계약
   ===================================================================== */
function screenContract() {
  const n = noticeOf(), R = S.result, c = CH();
  if (!n || !R) { S.screen = "list"; return screenList(); }
  if (!S.contract) {
    const amount = R.mine.amount;
    const bond = Math.round(amount * RULES.contractBondRate);
    const exempt = amount <= RULES.contractBondExempt;
    S.contract = { amount, bond, exempt, promised: false, done: false };
  }
  const k = S.contract;
  const amount = k.amount;
  const late = lateFee(amount, c.lateRate, 1);

  const bondBox = k.exempt
    ? '<div class="good"><b>계약보증금 면제</b> — 계약금액 ' + won(amount) + "원은 5천만원 이하입니다.<br>" +
      "면제여도 <b>지급확약서</b>는 내야 합니다. 계약을 어기면 계약금액의 10%(" + won(k.bond) + "원)를 현금으로 냅니다.</div>"
    : '<div class="warn"><b>계약보증금 ' + won(k.bond) + "원</b> — 계약금액의 10%입니다. 계약체결일까지 내야 합니다.<br>" +
      "내 자본 " + eok(S.capital) + "에서 빼면 " + eok(S.capital - k.bond) + "이 남습니다.</div>";

  const body =
    stepsHTML(6) +
    objbar("<b>계약</b> · 낙찰자 결정 통지 후 10일 안에 계약합니다") +
    '<div class="card" style="margin-top:12px">' +
      '<div class="tiny muted">낙찰자 결정 통지 후 10일 안에 계약합니다 · 남은 기한 ' + Math.max(0, RULES.contractDays - dDay(R.awardedAt || R.notifiedAt || S.now, S.now)) + "일 (통지 " + fDate(R.awardedAt || R.notifiedAt || S.now) + ")" +
      '<div class="big" style="margin:4px 0 8px">계약서</div>' +
      '<dl class="kv">' +
        "<dt>계약상대자</dt><dd>" + esc(S.company) + "</dd>" +
        "<dt>계약명</dt><dd>" + n.name + "</dd>" +
        "<dt>계약금액</dt><dd>" + won(amount) + "원 (부가세 포함)</dd>" +
        "<dt>계약기간</dt><dd>계약일부터 " + n.deliverDays + "일</dd>" +
        "<dt>" + T("late", "지체상금") + "률</dt><dd>" + c.lateLabel + " · 하루 " + won(late.raw) + "원</dd>" +
        "<dt>지체상금 상한</dt><dd>계약금액의 30% = " + won(late.cap) + "원</dd>" +
        "<dt>" + T("contractBond", "계약보증금") + "</dt><dd>" + (k.exempt ? "면제 (지급확약서 제출)" : won(k.bond) + "원 (10%)") + "</dd>" +
        "<dt>검사·대금</dt><dd>검사 14일 이내 · 청구 후 5일 이내(공휴일·토요일 제외)</dd>" +
      "</dl>" +
      '<div style="margin-top:12px">' + bondBox + "</div>" +
      (k.exempt ? '<ul class="checklist" style="margin-top:10px"><li class="' + (k.promised ? "on" : "") + '" data-act="promise"><span class="box">' + (k.promised ? "✓" : "") + '</span><span>지급확약서를 제출했습니다</span></li></ul>' : "") +
      '<div class="btn-row">' +
        '<button class="btn" data-act="signContract"' + (k.exempt && !k.promised ? " disabled" : "") + ">계약 체결</button>" +
        '<button class="btn danger" data-act="giveUpContract">계약 포기</button>' +
      "</div>" +
      '<p class="tiny muted" style="margin-top:8px">계약 포기는 보증금을 잃고 <b>6개월 입찰 제한</b>을 받습니다. 화면에 남겨 둔 이유는 실제로 그렇게 되기 때문입니다.</p>' +
    "</div>" +
    guide("계약에서 걸리는 두 가지",
      ["계약보증금을 안 내면 계약 자체가 안 됩니다. 면제여도 지급확약서가 필요합니다.",
       "낙찰통지 후 10일 안에 계약서를 작성하지 않으면 계약을 포기한 것으로 처리될 수 있습니다."],
      "contract");
  return chrome(body);
}

/* =====================================================================
   [30] 수행·대금
   ===================================================================== */
function screenPerform() {
  const n = noticeOf(), R = S.result, c = CH();
  if (!n || !R || !S.contract) { S.screen = "list"; return screenList(); }
  const k = S.contract;
  if (!S.perform) S.perform = { step: 0, lateDays: 0, fee: 0, invoice: null, paid: null, delivered: false, inspAsk: null, inspDue: null, claimDay: null, payDue: null };
  const p = S.perform;
  const amount = k.amount;
  const targets = [0.08, 0.42, 0.72, 0.95];
  const scene = sceneSVG(c.id, targets[Math.min(p.step, targets.length - 1)]);

  let core = "";
  if (p.step === 0) {
    core = '<div class="card"><div class="card-title"><span class="ico">1</span>일을 시작합니다</div>' +
      "<p>계약기간은 계약일부터 <b>" + n.deliverDays + "일</b>입니다. 지정 납품일은 <b>" + fDate(k.due || nextBiz(addDays(S.now, n.deliverDays))) + "</b>이고, 오늘 착수합니다.</p>" +
      '<div class="btn-row"><button class="btn" data-act="work" data-step="1">작업 시작</button></div></div>';
  } else if (p.step === 1) {
    core = '<div class="card"><div class="card-title"><span class="ico">2</span>작업 중</div>' +
      "<p>" + (c.id === "goods" ? "원단에 인쇄가 올라가고 있습니다." : c.id === "service" ? "무대와 조명을 세우고 있습니다." : "기초를 놓고 골조를 올리고 있습니다.") + "</p>" +
      '<div class="btn-row"><button class="btn" data-act="work" data-step="2">계속 진행</button></div></div>';
  } else if (p.step === 2) {
    core = '<div class="card"><div class="card-title"><span class="ico">3</span>완성했습니다</div>' +
      '<p class="tiny muted">지정 납품일은 <b>' + fDate(k.due || nextBiz(addDays(S.now, n.deliverDays))) + "</b>입니다. (계약일부터 " + n.deliverDays + "일 · 그날이 주말·공휴일이면 다음 영업일)</p>" +
      "<p>납품·이행완료 통지를 <b>날짜가 남는 형태</b>로 해야 합니다. 구두 통지는 나중에 지체일수 다툼이 됩니다.</p>" +
      '<div class="btn-row"><button class="btn" data-act="work" data-step="3">납품 완료 보고</button></div></div>';
  } else if (p.step === 3) {
    const lf = lateFee(amount, c.lateRate, p.lateDays);
    core = '<div class="card"><div class="card-title"><span class="ico">4</span>' + T("late", "지체상금") + "</div>" +
      '<div class="bad">지정 납품일 <b>' + fDate(k.due || S.now) + "</b>보다 <b>" + p.lateDays + "일</b> 늦은 <b>" + fDate(p.actual || S.now) + "</b>에 납품했습니다. (자재 입고 지연) " + T("late", "지체상금") + "이 붙습니다.</div>" +
      '<div class="calc" style="margin-top:10px">지체상금 = 계약금액 × 지체상금률 × 지체일수\n' +
      "        = " + won(amount) + " × " + c.lateRate + " × " + p.lateDays + "\n" +
      "        = " + won(lf.fee) + "원" + (lf.capped ? "\n(상한 30% 적용)" : "") + "</div>" +
      '<p class="tiny muted" style="margin-top:8px">지체상금은 협상 대상이 아닙니다. 발주기관이 책임 있는 일수는 자료로 증명해야 뺄 수 있습니다.</p>' +
      '<div class="btn-row"><button class="btn" data-act="work" data-step="4">검사 신청</button></div></div>';
  } else if (p.step === 4) {
    const inspDate = p.inspDue || prevBiz(addDays(S.now, RULES.inspectDays));
    core = '<div class="card"><div class="card-title"><span class="ico">5</span>' + T("inspect", "검사") + "</div>" +
      "<p>발주기관은 이행완료 통지를 받은 날부터 <b>14일</b> 안에 검사합니다. 검사에 합격해야 대금을 청구할 수 있습니다.</p>" +
      '<div class="warn">이행완료 통지일 · <b>' + fDate(p.inspAsk || S.now) + "</b> <span class='tiny muted'>(토·일·공휴일이면 다음 영업일)</span><br>검사 예정일 · <b>" + fDate(inspDate) + "</b> <span class='tiny muted'>(통지일부터 14일 이내 · 그날이 주말·공휴일이면 앞 영업일)</span></div>" +
      '<div class="card-title" style="margin-top:14px"><span class="ico">6</span>세금계산서를 언제 낼까요</div>' +
      '<p class="tiny muted">세금계산서 발행일이 청구일로 관리됩니다. 검사 전에 내면 반송될 수 있습니다.</p>' +
      '<div class="opts" style="margin-top:8px">' +
        '<button class="opt" data-act="invoice" data-v="after">검사가 끝난 뒤 낸다 (안전)</button>' +
        '<button class="opt" data-act="invoice" data-v="before">먼저 낸다 (빠를 것 같다)</button>' +
      "</div></div>";
  } else if (p.step === 5) {
    const due = p.payDue || addBizDays(p.claimDay || S.now, RULES.payDays);
    core = '<div class="card"><div class="card-title"><span class="ico">7</span>대금 지급</div>' +
      (p.invoice === "before"
        ? '<div class="warn"><b>세금계산서가 반송되었습니다.</b> 검사 완료 전에 발행했기 때문입니다. 반송일부터 다시 청구한 날까지는 지급기간에 넣지 않습니다. 5영업일이 다시 시작됩니다.</div>'
        : '<div class="good">검사 완료 후 청구했습니다. 청구를 받은 날부터 5영업일 안에 지급됩니다. (공휴일·토요일 제외)</div>') +
      '<div class="calc" style="margin-top:10px">계약금액        ' + won(amount) + "원\n" +
      "(-) 지체상금      " + won(p.fee) + "원\n" +
      "= 지급액         " + won(amount - p.fee) + "원\n" +
      "청구일           " + fDate(p.claimDay || S.now) + "\n" +
      "지급 예정일       " + fDate(due) + "  (청구 후 " + RULES.payDays + "영업일)</div>" +
      (k.bondPaid ? '<p class="tiny muted" style="margin-top:8px">계약보증금 ' + won(k.bond) + "원은 계약이 끝난 뒤 그대로 돌려받습니다. 위 지급액과는 따로 움직입니다.</p>" : "") +
      '<div class="btn-row"><button class="btn" data-act="work" data-step="6">대금을 받습니다</button></div></div>';
  } else {
    core = '<div class="card"><div class="card-title"><span class="ico">✓</span>이번 계약 결과</div>' +
      '<div class="good">대금이 입금되었습니다. 낙찰 1건을 완수했습니다.</div>' +
      '<div class="calc" style="margin-top:10px">계약금액        ' + won(amount) + "원\n" +
      "(-) 지체상금      " + won(p.fee) + "원\n" +
      "= 받은 대금      " + won(amount - p.fee) + "원\n" +
      "(-) 원가          " + won(k.cost || 0) + "원\n" +
      "= 이번 계약 손익  " + won(amount - p.fee - (k.cost || 0)) + "원\n" +
      "입금일           " + fDate(p.paid || S.now) + "</div>" +
      '<p class="tiny muted" style="margin-top:8px">지체상금은 받은 대금에서 이미 빠져 있습니다. 손익에서 다시 빼지 않습니다.</p>' +
      '<div class="btn-row"><button class="btn" data-act="finishJob">회사로 돌아가기</button></div></div>';
  }

  const body =
    stepsHTML(7) +
    objbar("<b>수행·대금</b> · " + (p.step === 0 ? "일을 시작합니다" : p.step === 1 ? "작업 중" : p.step === 2 ? "완성했습니다" : p.step === 3 ? "지체상금" : p.step === 4 ? "검사 · 세금계산서" : p.step === 5 ? "대금 지급" : "이번 계약 결과")) +
    '<div class="card" style="margin-top:12px">' +
      '<div class="tiny muted">수행 중 · ' + esc(S.company) + "</div>" +
      '<div class="big" style="font-size:20px;margin:2px 0 0">' + n.name + "</div>" +
      '<div class="tiny muted" style="margin-top:3px">계약금액 <b style="color:var(--ink)">' + won(amount) + "원</b> · 계약일부터 " + n.deliverDays + "일</div>" +
      scene + "</div>" +
    core +
    guide("수행·대금에서 실제로 걸리는 것",
      ["이행완료 통지는 날짜가 남게 합니다. 나중에 지체일수로 다툼이 생깁니다.",
       "검사 완료 전 세금계산서 발행은 반송 위험이 있습니다. 발행일이 청구일로 관리됩니다.",
       "지체상금이 계약보증금 상당액에 이르면 보증금이 국고로 들어가거나 추가 보증금을 내야 합니다."],
      "perform");
  return chrome(body);
}

/* =====================================================================
   [31] 결과 카드
   ===================================================================== */
function screenEnd() {
  const c = CH();
  const line1 = S.wins > 0
    ? "가장 낮은 가격만 써서는 이기지 못합니다. 1순위는 ‘심사 순서’일 뿐이고, 서류를 내야 낙찰이 됩니다."
    : "1순위가 낙찰이 아닙니다. 하한선 아래로 쓰면 1순위여도 심사 대상이 되지 않습니다.";
  const line2 = "면제받은 입찰보증금도, 계약을 어기면 현금으로 청구됩니다.";
  const line3 = S.sanctioned.length
    ? "공고문을 읽지 않으면 서류 하나 때문에 입찰이 통째로 무효가 됩니다. 제재는 6개월부터입니다."
    : "공고문의 참가자격과 마감 시각을 먼저 확인하는 것만으로 절반은 이깁니다.";
  const learned = S.learned.length;
  const slogan = "나는 ‘" + S.company + "’" + josaRo(S.company) + " 나라장터 입찰 " + Math.min(S.rounds, ROUNDS()) + "건에 도전해 " + S.wins + "건 낙찰, 최종 자본 " + eok(S.capital) + ". 1순위가 낙찰이 아니라는 걸 이제 압니다.";

  const body =
    stepsHTML(8) +
    objbar("<b>결과 카드</b> · 낙찰 " + S.wins + "건") +
    '<div class="result-card" style="margin-top:12px">' +
      '<div class="stampbig ' + (S.wins > 0 ? "" : "fail") + '" style="color:' + (S.wins > 0 ? "#7ff0c0" : "#ffb2ab") + '">' + (S.wins > 0 ? "낙찰 " + S.wins : "낙찰 없음") + "<small>결과 카드</small></div>" +
      '<div class="rc-top"><span>결과 카드</span><span>' + fDate(S.now) + "</span></div>" +
      "<h2>" + esc(S.company) + "</h2>" +
      '<div class="rsub">' + c.name + " · " + c.who + "</div>" +
      '<div class="rgrid">' +
        '<div><div class="k">최종 자본</div><div class="v">' + eok(S.capital) + "</div></div>" +
        '<div><div class="k">낙찰</div><div class="v">' + S.wins + "건</div></div>" +
        '<div><div class="k">도전</div><div class="v">' + Math.min(S.rounds, ROUNDS()) + "회</div></div>" +
        '<div><div class="k">제재 이력</div><div class="v">' + (S.sanctioned.length ? S.sanctioned.length + "건" : "없음") + "</div></div>" +
      "</div>" +
      '<div class="rline"><b>배운 용어 ' + learned + "개</b> · " + (S.sanctioned.length ? "제재 " + S.sanctioned.join(", ") : "제재 없음") + "</div>" +
      '<div class="slogan">' + slogan + "</div>" +
    "</div>" +
    '<div class="card" style="margin-top:14px">' +
      '<div class="card-title"><span class="ico">✓</span>이 게임에서 배운 것</div>' +
      "<p>1. " + line1 + "</p><p>2. " + line2 + "</p><p>3. " + line3 + "</p>" +
    "</div>" +
    '<div class="card">' +
      '<div class="card-title"><span class="ico">→</span>실제로 나라장터를 할 때 확인할 것</div>' +
      "<p>1. 공고문의 <b>참가자격</b>과 <b>마감 시각</b>을 먼저 확인하십시오. 내 업종이라도 직접생산확인·면허가 없으면 들어갈 수 없습니다.</p>" +
      "<p>2. 공고문의 <b>낙찰자 결정방법</b>과 <b>낙찰하한율</b>을 보고 값을 정하십시오. 기초금액의 102%를 넘는 투찰은 접수되지 않는 경우가 많으니, 공고에 적힌 투찰 상한을 먼저 확인하십시오.</p>" +
      "<p>3. 낙찰되면 <b>5일 안에 적격심사 서류</b>, <b>10일 안에 계약</b>입니다. 이 두 기한을 놓치면 낙찰이 사라집니다.</p>" +
      "<p>4. 이 게임의 수치·판정(투찰 상한, 하한·안전 구간, 점수, 기한, 보증금)은 교육을 위해 단순화한 <b>게임 설정</b>입니다. 공고마다 다를 수 있으므로 실제 입찰에서는 해당 <b>공고문과 나라장터 유의사항</b>을 확인하십시오.</p>" +
    "</div>" +
    '<div class="card"><div class="card-title"></div>' +
      '<div class="btn-row actions">' +
        '<button class="btn big-btn" data-act="restart">같은 업종으로 다시</button>' +
        '<button class="btn ghost" data-act="newGame">업종부터 다시</button>' +
        '<button class="btn subtle" data-act="glossary">배운 용어 ' + learned + "개 보기</button>" +
      "</div></div>" +
    guide("결과를 어떻게 읽으면 좋을까요",
      ["낙찰 건수보다 <b>왜 그렇게 됐는지</b>가 중요합니다. 개찰표의 투찰률(예정가격 대비)을 다시 보십시오.",
       "제재 이력이 있다면 그 이유를 확인하십시오. 실제로는 1개월에서 2년까지 이어집니다."]);
  return chrome(body);
}
/* =====================================================================
   [32] 조작 처리
   ===================================================================== */
function commitName(name) {
  const c = CH();
  S.company = name;
  S.capital = c.start.capital;
  S.perf = c.start.perf;
  S.staff = c.start.staff;
  S.license = c.start.license;
  S.ownProd = c.start.ownProd;
  S.credit = c.credit;
  S.now = RULES.base;
  S.phase = "list";
  S.rounds = 0;
  buildNotices();
  stampFx("참가자격 등록 완료", esc(name) + " · " + c.name + " 업종으로 나라장터에 등록했습니다.", () => {
    S.screen = "dashboard";
    render();
  });
  S.screen = "name";
  render();
}
function gotoNextRound() {
  if (S.rounds >= ROUNDS()) { S.screen = "end"; S.phase = "end"; render(); return; }
  /* 판이 바뀌면 다음 영업일로 넘어간다 — 게임 시계가 흘러야 같은 공고의 마감도 날짜와 맞는다 */
  S.now = nextBiz(addDays(S.now, 1));
  buildNotices();
  S.phase = "list";
  S.screen = "list";
  render();
}

/* =====================================================================
   인트로 조작 — ACT 에 없는 이름만 쓴다 (스플래시·스토리 넘기기)
   ===================================================================== */
document.addEventListener("click", e => {
  const t = (e.target && e.target.closest) ? e.target.closest("[data-act]") : null;
  if (t) {
    const a = t.dataset.act;
    if (a === "splashGo") { if (GATE && BEAT === 0) { clearTimeout(window.__splashT); BEAT = 1; render(); } return; }
    if (a === "introNext") { if (GATE) { BEAT = Math.min(5, BEAT + 1); render(); } return; }
    if (a === "skipStory") { if (GATE) { BEAT = 5; render(); } return; }
    /* 개업 — 캐릭터를 고르면 회사는 이미 차려져 있다. 바로 대시보드로. */
    if (a === "startBiz") { const c = charOf(S.charId); if (!c) return; S.autoName = c.shop; S.typedName = c.shop; ACT.useAuto(); return; }
    if (a === "fxGet") { closeModal(); return; }
    if ((a === "newGame" || a === "continue") && GATE) GATE = false;
  }
}, true);

const ACT = {
  newGame: () => { const m = S.mode; S = freshState(); S.mode = m; S.screen = "sector"; render(); },
  continue: () => { const o = load(); if (o) { S = o; if (!S.learned) S.learned = []; render(); } },
  mode: el => { S.mode = el.dataset.v; render(); },
  pickChar: el => { S.charId = el.dataset.id; render(); },
  quiz: el => { S.quiz[+el.dataset.q] = el.dataset.v; render(); },
  toName: () => { S.screen = "name"; S.nameMode = "auto"; S.autoName = S.autoName || genName(S.charId); render(); },
  modeName: el => { S.nameMode = el.dataset.m; render(); },
  reroll: () => { S.autoName = genName(S.charId); render(); },
  useAuto: () => commitName(S.autoName),
  useManual: () => {
    const v = validateName(S.typedName);
    if (!v.ok) { toast(v.msg); return; }
    commitName(String(S.typedName).trim());
  },

  toDash: () => { S.screen = "dashboard"; S.phase = "list"; render(); },
  toList: () => { if (!S.notices.length) buildNotices(); S.screen = "list"; S.phase = "list"; render(); },
  openNotice: el => {
    S.noticeId = el.dataset.id; S.watch = null; S.readOk = false; S.bid = null; S.bondChoice = "memo";
    S.screen = "detail"; render();
  },
  bond: el => { S.bondChoice = el.dataset.v; render(); },
  watch: el => {
    if (!S.watch) return;
    S.watch.ans[+el.dataset.n] = el.dataset.v;
    if (watchDone()) S.readOk = true;
    render();
  },
  docAll: el => {
    document.querySelectorAll(".art").forEach(a => {
      if (el.dataset.v === "close") a.classList.add("closed"); else a.classList.remove("closed");
    });
  },
  docTop: () => { const d = document.querySelector(".doc"); if (d) d.scrollIntoView({ block: "start", behavior: "smooth" }); },
  apply: () => {
    S.phase = "bid";
    S.bid = { amount: 0, picks: [], step: "pick" };
    stampFx("참가 신청 접수", "입찰보증금 " + (S.bondChoice === "memo" ? "지급각서 제출 (면제)" : "현금 납부") + " · 이제 투찰 화면입니다.", () => {
      S.screen = "bid"; render();
    });
    S.screen = "bid";
  },
  applyCareless: () => {
    S.careless = true;
    S.phase = "bid";
    S.bid = { amount: 0, picks: [], step: "pick" };
    toast("공고문 조건을 짚지 않고 진행합니다. 다음 판에서 서류가 빠져 무효가 됩니다.");
    S.screen = "bid"; render();
  },
  toDetail: () => { S.screen = "detail"; render(); },
  pickNo: el => {
    if (!S.bid || S.bid.step !== "pick") return;
    const k = +el.dataset.k, i = S.bid.picks.indexOf(k);
    if (i >= 0) S.bid.picks.splice(i, 1);
    else if (S.bid.picks.length < 2) S.bid.picks.push(k);
    else { toast("예비가격번호는 2개까지만 뽑을 수 있습니다."); return; }
    if (S.bid.picks.length === 2) S.bid.step = "amount";
    render();
  },
  fill: el => {
    const n = noticeOf(), v = el.dataset.v;
    let amt = 0;
    if (v === "safe") { const sb = safeBand(n); amt = (sb.low + sb.high) / 2; }
    else if (v === "lb") amt = n.base * (n.lb + 0.001);
    else if (v === "mid") amt = n.base * 0.95;
    else if (v === "base") amt = n.base;
    else if (v === "under") amt = n.base * (n.lb - 0.03);
    else if (v === "over") amt = n.base * 1.03;
    S.bid.amount = Math.round(amt / 1000) * 1000;
    render();
  },
  submitBid: submitBid,
  undo: () => {
    if (S.undoLeft <= 0) { toast("되돌리기는 한 판에 한 번뿐입니다."); return; }
    S.undoLeft--;
    S.bid = null;
    S.screen = "detail";
    toast("참가 신청을 되돌렸습니다. 실제로는 투찰 후 되돌릴 수 없습니다.");
    render();
  },
  toQual: () => { S.qual = null; S.screen = "qual"; S.phase = "qual"; render(); },
  afterLose: () => { gotoNextRound(); },

  doc: el => {
    const i = +el.dataset.i;
    S.qual.docs[i] = !S.qual.docs[i];
    render();
  },
  submitQual: () => {
    const q = S.qual, R = S.result;
    const missing = q.docs.filter(x => !x).length;
    if (missing) {
      q.tried++;
      if (q.tried >= 2) {
        q.phase = "result"; q.failed = "docs";
        q.pricePart = priceScore(R.mine.amount, R.yej); q.score = 0;
        toast("서류를 두 번 놓쳤습니다. 차순위로 넘어갑니다.");
        render(); return;
      }
      q.fixDeadline = addDays(S.now, RULES.qualFixDays);
      toast("서류 " + missing + "개가 빠졌습니다. 7일 안에 보완하여 다시 내십시오.");
      render(); return;
    }
    q.pricePart = priceScore(R.mine.amount, R.yej);
    q.score = q.pricePart + RULES.nonPriceScore;
    q.phase = "result";
    /* 통과해야 낙찰자 확정 — 심사에 걸린 3영업일만큼 게임 시계도 흘러 낙찰자 결정 통지일이 된다 */
    if (q.score >= CH().qualScore) {
      S.now = addBizDays(S.now, RULES.qualReviewDays);
      R.awardedAt = S.now;
    }
    render();
  },
  delayQual: () => {
    const q = S.qual;
    if (bizDaysLeft(S.now, q.deadline) <= 0) {
      q.phase = "result"; q.score = 0; q.pricePart = 0; S.qual.failed = "late";
      toast("5영업일이 지났습니다. 서류를 내지 않아 차순위로 넘어갑니다.");
      render(); return;
    }
    S.now = addDays(S.now, 1);
    toast("하루 미뤘습니다. 남은 기한 " + bizDaysLeft(S.now, q.deadline) + "영업일" + (isBn(S.now) ? " (오늘은 토·일·공휴일이라 기한이 줄지 않습니다)" : ""));
    render();
  },
  reexam: () => { toast("재심사를 요청했습니다. 새 서류는 붙일 수 없어 결과는 그대로입니다."); S.qual.phase = "result"; render(); },
  giveUpQual: () => {
    S.sanctioned.push("계약 미체결 6개월");
    S.fails++;
    toast("적격심사를 포기했습니다. 차순위로 넘어가고 6개월 제재가 남습니다.");
    gotoNextRound();
  },
  toContract: () => { S.contract = null; S.screen = "contract"; S.phase = "contract"; render(); },
  promise: () => { S.contract.promised = !S.contract.promised; render(); },
  signContract: () => {
    const k = S.contract, c = CH(), n = noticeOf();
    k.cost = Math.round(k.amount * c.costRate);
    /* 계약일과 지정 납품일을 계약 시점에 고정한다 — 수행 화면의 지체일수가 이 날짜를 본다 */
    k.contractDay = S.now;
    k.deliverDays = n ? n.deliverDays : 30;
    /* 계약일부터 N일이 주말·공휴일이면 다음 영업일까지가 지정 납품일 */
    k.due = nextBiz(addDays(k.contractDay, k.deliverDays));
    if (!k.exempt) { S.capital -= k.bond; k.bondPaid = true; }
    k.done = true;
    document.getElementById("modal-root").innerHTML =
      '<div class="modal-bg"><div class="modal" style="max-width:360px;text-align:center">' +
      '<svg class="seal" width="120" height="70" viewBox="0 0 120 70" style="display:block;margin:0 auto 6px">' +
      '<text x="60" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#c0392b" font-family="serif">' + esc(S.company) + "</text>" +
      '<text x="60" y="58" text-anchor="middle" font-size="13" fill="#c0392b" font-family="serif">(인)</text></svg>' +
      "<h3>계약을 체결했습니다</h3><p class='tiny muted'>" + fDate(S.now) + " · 낙찰자 결정 통지 후 10일 이내</p></div></div>";
    setTimeout(() => {
      document.getElementById("modal-root").innerHTML = "";
      S.perform = null; S.screen = "perform"; S.phase = "perform"; render();
    }, 1200);
    S.capital -= 0;
  },
  giveUpContract: () => {
    const k = S.contract;
    const forfeit = Math.min(S.capital, k.bond);
    S.capital -= forfeit;
    S.sanctioned.push("계약 미체결 6개월");
    S.fails++;
    toast("계약을 포기했습니다. 보증금 상당액 " + eok(forfeit) + "을 물고 6개월 제재가 남습니다.");
    S.screen = "end"; S.phase = "end"; render();
  },

  work: el => {
    const p = S.perform, step = +el.dataset.step, c = CH(), k = S.contract;
    /* 계약기간(납기)을 실제로 쓰게 한다 — 날짜는 계약일에서 계산한다 */
    const len = k.deliverDays || 30;
    const from = k.contractDay || S.now;
    if (step === 1) { S.now = nextBiz(addDays(from, Math.max(1, Math.round(len * 0.33)))); p.step = 1; }
    else if (step === 2) { S.now = nextBiz(addDays(from, Math.max(2, Math.round(len * 0.7)))); p.step = 2; }
    else if (step === 3) {
      /* 자재 입고가 늦어 지정 납품일보다 사흘 늦게 납품 — 주말·공휴일이면 다음 영업일 */
      const planned = k.due ? nextBiz(addDays(k.due, 3)) : nextBiz(addDays(S.now, 3));
      p.actual = planned;
      S.now = planned;
      p.lateDays = k.due ? Math.max(1, diffDays(k.due, planned)) : 3;
      p.fee = lateFee(k.amount, c.lateRate, p.lateDays).fee;
      p.step = 3;
    } else if (step === 4) {
      p.inspAsk = S.now;
      p.inspDue = prevBiz(addDays(S.now, RULES.inspectDays));
      p.step = 4;
    }
    else if (step === 6) {
      const due = p.payDue || addBizDays(p.claimDay || S.now, RULES.payDays);
      S.now = due;
      S.capital += (k.amount - p.fee) - (k.cost || 0) + (k.bondPaid ? k.bond : 0);
      S.perf += k.amount;
      S.wins++;
      p.paid = due;
      p.step = 6;
    }
    render();
  },
  invoice: el => {
    const p = S.perform;
    p.invoice = el.dataset.v;
    /* 검사가 끝나는 날(=청구할 수 있는 날)을 기준으로 기한을 잡는다.
       검사 전에 낸 계산서는 반송되고, 반송일부터 다시 청구한 날까지는 지급기간에 넣지 않는다. */
    const done = p.inspDue || prevBiz(addDays(S.now, RULES.inspectDays));
    p.claimDay = p.invoice === "before" ? nextBiz(addDays(done, RULES.invoiceBounceDays)) : done;
    p.payDue = addBizDays(p.claimDay, RULES.payDays);
    S.now = p.claimDay;
    p.step = 5;
    render();
  },
  finishJob: () => { gotoNextRound(); },

  applyCert: () => {
    if (S.ownProd) return;
    S.ownProd = true;
    S.now = addDays(S.now, 7);
    buildNotices();
    toast("직접생산확인증명서를 받았습니다 (유효기간 2년). 이제 인쇄 공고에 참가할 수 있습니다.");
    render();
  },
  glossary: () => openGlossary(),
  closeModal: () => closeModal(),
  closeTerm: () => closeTerm(),
  nextTerm: () => {
    const rest = Array.from(new Set(Array.from(document.querySelectorAll(".term.new")).map(t => t.dataset.term)));
    closeTerm();
    if (rest.length) showTerm(rest[0]);
  },
  toEnd: () => { S.screen = "end"; S.phase = "end"; render(); },
  restart: () => {
    const id = S.charId, m = S.mode, name = S.company;
    S = freshState(); S.mode = m; S.charId = id; S.autoName = name; S.typedName = name;
    S.screen = "sector"; render();
  }
};

document.addEventListener("click", e => {
  const bg = e.target.closest(".modal-bg");
  const stop = e.target.closest("[data-stop]");
  if (bg && !stop) { closeModal(); return; }
  const sec = e.target.closest(".art > h5");
  if (sec && !e.target.closest(".term")) { sec.parentNode.classList.toggle("closed"); return; }
  const el = e.target.closest("[data-act]");
  if (!el) {
    const t = e.target.closest(".term");
    if (t) { showTerm(t.dataset.term); }
    return;
  }
  const act = el.dataset.act;
  if (act === "closeModal" && !el.classList.contains("modal-bg")) { closeModal(); return; }
  if (ACT[act]) { ACT[act](el, e); }
});

/* =====================================================================
   [33] 시작
   ===================================================================== */
(function boot() {
  const saved = load();
  S = saved || freshState();
  if (!S.learned) S.learned = [];
  if (S.screen && S.screen !== "end" && S.company) { render(); return; }
  S.screen = "intro";
  render();
})();
</script></body></html>
